<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Читаю уважно: тексти з числами</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#253042; --sand:#DBC3A9; --sand-l:#F4EBE1; --sand-xl:#FAF5EF;
    --terra:#AF5940; --terra-d:#93462F; --grey:#797B6E; --line:#E6D9CA;
    --ok:#2E8B57; --ok-bg:#E3F4E8; --bad:#C8423B; --bad-bg:#FCE6E3; --sel:#FFE8A8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--sand-l);color:var(--navy);font-family:Montserrat,"Gotham Book",Arial,sans-serif;font-size:18px;line-height:1.6}
  button{font:inherit;color:inherit;cursor:pointer}
  .top{background:var(--navy);color:#fff;padding:22px 24px 26px;position:relative;overflow:hidden}
  .top::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--terra);opacity:.9}
  .top::before{content:"";position:absolute;right:130px;bottom:-70px;width:120px;height:120px;border-radius:50%;background:var(--sand);opacity:.85}
  .top>*{position:relative;z-index:1;max-width:1180px;margin-left:auto;margin-right:auto}
  .top .brand{font-size:14px;font-weight:600;letter-spacing:.06em;color:var(--sand)}
  .top h1{margin:4px auto 0;font-size:32px;line-height:1.2;font-weight:700}
  .top p{margin:6px auto 0;color:#E6E6E6;font-size:16px}
  main{max-width:1180px;margin:0 auto;padding:26px 18px 60px}

  .intro{background:#fff;border-radius:20px;padding:20px 24px;margin-bottom:8px;box-shadow:0 4px 18px rgba(37,48,66,.06)}
  .intro h2{margin:0 0 6px;font-size:21px;font-weight:700}
  .intro p{margin:6px 0}
  .group{font-size:22px;font-weight:700;margin:28px 0 14px;display:flex;align-items:center;gap:10px}
  .group::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--terra)}
  .group.g2::before{background:var(--grey)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
  .tcard{text-align:left;background:#fff;border:none;border-radius:20px;padding:18px 20px 20px;box-shadow:0 4px 18px rgba(37,48,66,.07);transition:transform .15s,box-shadow .15s;border-top:6px solid var(--navy)}
  .tcard:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(37,48,66,.13)}
  .tcard.k-ad{border-top-color:var(--sand)} .tcard.k-promo{border-top-color:var(--terra)} .tcard.k-news{border-top-color:var(--grey)}
  .tcard .kind{display:inline-block;font-size:13px;font-weight:600;background:var(--sand-l);border-radius:20px;padding:3px 12px}
  .tcard h3{margin:10px 0 4px;font-size:20px;line-height:1.3;font-weight:700}
  .tcard .lvl{font-size:14px;color:var(--grey)}
  .tcard .done{margin-top:8px;font-size:15px;color:var(--ok);font-weight:700}

  .back{background:none;border:none;color:var(--navy);padding:4px 0;margin-bottom:14px;font-size:16px;font-weight:600}
  .back:hover{color:var(--terra)}
  .layout{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;align-items:start}
  @media (max-width:860px){.layout{grid-template-columns:1fr}}
  .textcard{background:#fff;border-radius:20px;padding:22px 24px;position:sticky;top:14px;box-shadow:0 4px 18px rgba(37,48,66,.08);border-left:8px solid var(--navy)}
  @media (max-width:860px){.textcard{position:static}}
  .textcard .label{display:inline-block;font-size:13px;font-weight:600;color:#fff;background:var(--navy);border-radius:20px;padding:3px 12px;margin-bottom:12px}
  .textcard p{margin:0 0 10px}
  .textcard p:last-child{margin-bottom:0}
  .textcard.k-task p.q{font-weight:700;color:var(--terra-d)}
  .textcard.k-ad{border-left:none;background:#FFFCF5;border:3px dashed var(--sand)}
  .textcard.k-ad .label{background:var(--sand);color:var(--navy)}
  .textcard.k-ad .head{font-weight:700;font-size:23px;text-align:center;letter-spacing:.03em;color:var(--terra)}
  .textcard.k-ad .tabs{display:flex;gap:6px;margin-top:14px}
  .textcard.k-ad .tabs span{flex:1;height:36px;border:2px dashed var(--sand);border-top:none;border-radius:0 0 8px 8px}
  .textcard.k-promo{border-left:none;padding-top:0;overflow:hidden}
  .textcard.k-promo .label{background:var(--terra);margin-top:22px}
  .textcard.k-promo .head{background:var(--terra);color:#fff;font-weight:700;font-size:21px;line-height:1.3;margin:0 -24px 14px;padding:14px 24px}
  .textcard.k-promo .head::before{content:"🎄 "}
  .textcard.k-news{border-left-color:var(--grey);font-family:Georgia,"Times New Roman",serif}
  .textcard.k-news .label{background:var(--grey);font-family:Montserrat,Arial,sans-serif}
  .textcard.k-news .paper{border-bottom:3px double var(--navy);font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding-bottom:4px;margin-bottom:10px}
  .textcard.k-news .head{font-size:23px;font-weight:bold;line-height:1.25}

  .work{background:#fff;border-radius:20px;padding:22px 24px;min-height:300px;box-shadow:0 4px 18px rgba(37,48,66,.08)}
  .stepper{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .stepper span{font-size:14px;font-weight:600;padding:5px 14px;border-radius:25px;background:var(--sand-l);color:var(--grey)}
  .stepper span.cur{background:var(--navy);color:#fff}
  .stepper span.past{background:var(--ok-bg);color:var(--ok)}
  .stepper span.past::before{content:"✓ "}
  .ex h2{margin:0 0 4px;font-size:22px;font-weight:700}
  .ex .how{margin:0 0 16px;color:#4A5468;font-size:17px}

  .tf{border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;background:var(--sand-xl);position:relative}
  .tf .st{margin:0 0 10px;font-weight:500;padding-right:30px}
  .opts{display:flex;gap:10px;flex-wrap:wrap}
  .opt{border:2px solid var(--sand);background:#fff;border-radius:25px;padding:7px 20px;font-size:16px;font-weight:600;transition:background .12s}
  .opt:hover{border-color:var(--terra)}
  .opt.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .tf.ok,.mcq.ok{border-color:var(--ok);background:var(--ok-bg)}
  .tf.bad,.mcq.bad{border-color:var(--bad);background:var(--bad-bg)}
  .tf.ok::after,.mcq.ok::after{content:"✓";position:absolute;right:14px;top:10px;font-size:22px;font-weight:700;color:var(--ok)}
  .tf.bad::after,.mcq.bad::after{content:"✗";position:absolute;right:14px;top:10px;font-size:22px;font-weight:700;color:var(--bad)}
  .expl{display:none;margin-top:10px;font-size:16px;padding:9px 14px;border-radius:12px;background:#fff}
  .show .expl,.expl.show{display:block}

  .sent{margin:0 0 14px;line-height:2.5}
  .slot{display:inline-flex;align-items:center;justify-content:center;min-width:110px;min-height:46px;vertical-align:middle;border:2px dashed var(--terra);border-radius:12px;padding:2px 4px;background:var(--sand-xl);margin:0 2px}
  .slot.hover{background:var(--sel);border-style:solid}
  .slot.ok{border:2px solid var(--ok);background:var(--ok-bg)}
  .slot.bad{border:2px solid var(--bad);background:var(--bad-bg)}
  .bank{display:flex;flex-wrap:wrap;gap:10px;min-height:66px;padding:14px;border-radius:16px;background:var(--sand-l);border:2px solid var(--line);margin:16px 0}
  .bank.hover{background:#EFE2D3}
  .bank:empty::after{content:"Усі картки розкладено";color:var(--grey);font-size:15px;align-self:center}
  .chip{touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;border:2px solid var(--navy);border-radius:12px;padding:7px 15px;font-size:17px;font-weight:500;line-height:1.35;cursor:grab;box-shadow:0 3px 0 var(--sand)}
  .chip:hover{border-color:var(--terra)}
  .chip.selected{background:var(--sel);outline:3px solid #E8B93A}
  .chip.placeholder{opacity:.3}
  .chip.locked{cursor:default;box-shadow:none;border-color:var(--ok)}
  .ghost{position:fixed;z-index:1000;pointer-events:none;box-shadow:0 10px 24px rgba(37,48,66,.3);transform:rotate(-2deg);margin:0}
  .slot .chip{box-shadow:none}

  .ord{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .ord .n{flex:0 0 36px;height:36px;border-radius:50%;background:var(--terra);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
  .ord .slot{flex:1;justify-content:flex-start;min-height:54px;padding:4px}
  .ord .slot .chip{width:100%}
  .task-q{background:var(--sand-xl);border-left:6px solid var(--terra);border-radius:12px;padding:12px 16px;margin:0 0 16px}

  .mcq{border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px;background:var(--sand-xl);position:relative}
  .mcq .q{margin:0 0 10px;font-weight:700;padding-right:30px}
  .mcq .opts{flex-direction:column}
  .mcq .opt{text-align:left;border-radius:12px}
  .mcq .opt.right{border-color:var(--ok);background:#fff;color:var(--ok)}
  .mcq .opt.wrong{border-color:var(--bad);background:#fff;color:var(--bad)}

  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
  .btn{border:2px solid transparent;border-radius:25px;padding:11px 26px;font-size:17px;font-weight:700;transition:background .12s}
  .btn.main{background:var(--terra);color:#fff}
  .btn.main:hover{background:var(--terra-d)}
  .btn.main:disabled{opacity:.4;cursor:default}
  .btn.sec{background:#fff;border-color:var(--navy);color:var(--navy)}
  .btn.sec:hover{background:var(--sand-l)}
  .hidden{display:none !important}
  .fb{margin-top:12px;font-weight:700;min-height:1.6em}
  .fb.good{color:var(--ok)}
  .fb.meh{color:var(--bad)}
  .fullexpl{margin-top:12px;padding:12px 16px;border-radius:12px;background:var(--sand-xl);border-left:6px solid var(--sand);font-size:16px}

  .summary h2{margin-top:0;font-weight:700}
  .summary table{border-collapse:collapse;width:100%;margin:10px 0 16px}
  .summary td{padding:9px 6px;border-bottom:1px solid var(--line)}
  .summary td:last-child{text-align:right;font-weight:700}
  .big{display:inline-block;font-size:28px;font-weight:700;margin:6px 0;color:#fff;background:var(--terra);border-radius:25px;padding:4px 22px}
</style>
</head>
<body>
<header class="top">
  <div class="brand">nadia.school</div>
  <h1>Читаю уважно</h1>
  <p>Тренування: знаходимо в тексті числа і розуміємо, що з ними робити</p>
</header>
<main id="app"></main>

<script>
/* =====================================================================
   ДАНІ. Щоб додати новий текст, скопіюй один блок { ... } і зміни його.
   kind: task (умова задачі) | ad (оголошення) | promo (реклама) | news (замітка)
   tf.a: "yes" (Правда) | "no" (Неправда; також якщо в тексті про це не сказано)
   fill: у реченнях пропуск позначено {a:"id картки"}; зайві картки просто
         не використовуються в жодному реченні.
   order.steps.needs: які дії мають стояти раніше за цю.
   ===================================================================== */
const TEXTS = [
{
  kind:"task", label:"Умова задачі", title:"Соломія і олімпіада", lvl:"Рівень 1",
  body:[
    "Соломія готується до олімпіади з математики. У понеділок вона розв’язала 6 задач, у вівторок утричі більше, ніж у понеділок, а в середу на 5 задач менше, ніж у вівторок.",
    {q:"Скільки задач розв’язала Соломія за три дні?"}
  ],
  tf:[
    {s:"У вівторок Соломія розв’язала 9 задач.", a:"no", e:"«Утричі більше» означає помножити на 3: 6 · 3 = 18 задач. 9 задач вийшло б, якби до 6 додали 3."},
    {s:"У середу Соломія розв’язала більше задач, ніж у понеділок.", a:"yes", e:"У середу 18 − 5 = 13 задач, а в понеділок 6. 13 більше за 6."},
    {s:"У середу задач було на 5 менше, ніж у понеділок.", a:"no", e:"Уважно до кінця речення: на 5 менше, ніж у вівторок, а не в понеділок."},
    {s:"Щодня Соломія розв’язувала більше задач, ніж напередодні.", a:"no", e:"У вівторок 18 задач, а в середу 18 − 5 = 13. У середу задач стало менше, ніж напередодні."}
  ],
  fill:{
    items:[
      ["У понеділок Соломія розв’язала ",{a:"c6"}," задач."],
      ["У вівторок у ",{a:"c3"}," рази більше, ніж у понеділок."],
      ["У середу на 5 задач менше, ніж ",{a:"ctue"},"."],
      ["Треба знайти, скільки задач Соломія розв’язала ",{a:"c3d"},"."]
    ],
    chips:[{id:"c6",t:"6"},{id:"c3",t:"3"},{id:"ctue",t:"у вівторок"},{id:"c3d",t:"за три дні"},{id:"c18",t:"18"},{id:"cmon",t:"у понеділок"},{id:"c5",t:"5"}],
    e:"6 задач у понеділок. «Утричі» означає у 3 рази. У середу порівнюємо з вівторком. Шукаємо кількість задач за три дні. Числа 18 у тексті немає, його треба обчислити."
  },
  mc:[
    {q:"Який вираз показує, скільки задач Соломія розв’язала у вівторок?", o:["6 + 3","6 · 3","6 − 3","6 : 3"], a:"6 · 3", e:"«Утричі більше» означає «у 3 рази більше», тобто множимо: 6 · 3 = 18."},
    {q:"Скільки задач Соломія розв’язала в середу?", o:["1","13","18","23"], a:"13", e:"18 − 5 = 13. Відповідь 1 виходить, якщо помилково відняти 5 від понеділка: 6 − 5."}
  ],
  order:{
    q:"Скільки задач розв’язала Соломія за три дні?",
    steps:[
      {id:"a",t:"Знайти, скільки задач Соломія розв’язала у вівторок",needs:[]},
      {id:"b",t:"Знайти, скільки задач Соломія розв’язала в середу",needs:["a"]},
      {id:"c",t:"Знайти, скільки задач вона розв’язала за три дні",needs:["a","b"]}
    ],
    extra:[{id:"x",t:"Знайти, на скільки більше задач у вівторок, ніж у понеділок"}],
    e:"6 · 3 = 18 (задач) у вівторок. 18 − 5 = 13 (задач) у середу. 6 + 18 + 13 = 37 (задач) за три дні."
  }
},
{
  kind:"task", label:"Умова задачі", title:"Навушники на складі", lvl:"Рівень 1",
  body:[
    "На складі інтернет-магазину стояли дві коробки з навушниками. У першій коробці було 48 пар, а в другій на 15 пар менше. У понеділок з першої коробки відправили покупцям 20 пар, а з другої 12 пар.",
    {q:"Скільки пар навушників залишилося в обох коробках разом?"}
  ],
  tf:[
    {s:"У другій коробці було 15 пар навушників.", a:"no", e:"15 це не кількість, а різниця. У другій коробці на 15 пар менше: 48 − 15 = 33 пари."},
    {s:"У понеділок з першої коробки відправили більше пар, ніж з другої.", a:"yes", e:"З першої відправили 20 пар, з другої 12. 20 більше за 12."},
    {s:"Усі навушники на складі однакової моделі.", a:"no", e:"Про моделі навушників у тексті нічого не сказано, тому вважати це правдою не можна."},
    {s:"У першій коробці навушників було більше, ніж у другій.", a:"yes", e:"У другій коробці на 15 пар менше, отже в першій більше."}
  ],
  fill:{
    items:[
      ["У першій коробці було ",{a:"c48"}," пар."],
      ["У другій коробці на ",{a:"c15"}," пар менше, ніж у першій."],
      ["З другої коробки відправили ",{a:"c12"}," пар."],
      ["Потрібно знайти, скільки пар ",{a:"cleft"},"."]
    ],
    chips:[{id:"c48",t:"48"},{id:"c15",t:"15"},{id:"c12",t:"12"},{id:"cleft",t:"залишилося в обох коробках разом"},{id:"c20",t:"20"},{id:"c33",t:"33"},{id:"csent",t:"відправили в понеділок"}],
    e:"Число 20 стосується першої коробки, а не другої. Числа 33 в умові немає, його треба обчислити. Головне запитання про те, скільки залишилося, а не скільки відправили."
  },
  mc:[
    {q:"Що потрібно знайти в задачі?", o:["Скільки пар було в другій коробці","Скільки пар відправили в понеділок","Скільки пар залишилося в обох коробках разом","На скільки більше пар було в першій коробці"], a:"Скільки пар залишилося в обох коробках разом", e:"Головне запитання стоїть у кінці умови: «Скільки пар навушників залишилося в обох коробках разом?»"},
    {q:"Якого числа немає в умові, тож його треба обчислити?", o:["48","15","33","20"], a:"33", e:"33 пари було в другій коробці. Цього числа в тексті немає, його знаходимо дією 48 − 15."}
  ],
  order:{
    q:"Скільки пар навушників залишилося в обох коробках разом?",
    steps:[
      {id:"a",t:"Знайти, скільки пар було в другій коробці",needs:[]},
      {id:"b",t:"Знайти, скільки пар залишилося в першій коробці",needs:[]},
      {id:"c",t:"Знайти, скільки пар залишилося в другій коробці",needs:["a"]},
      {id:"d",t:"Знайти, скільки пар залишилося в обох коробках разом",needs:["b","c"]}
    ],
    extra:[{id:"x",t:"Знайти, на скільки більше пар відправили з першої коробки, ніж з другої"}],
    e:"48 − 15 = 33 (пари) було в другій коробці. 48 − 20 = 28 (пар) залишилося в першій. 33 − 12 = 21 (пара) залишилася в другій. 28 + 21 = 49 (пар) залишилося разом. Дію з першою коробкою можна поставити будь-де перед останньою."
  }
},
{
  kind:"task", label:"Умова задачі", title:"Дорога до озера", lvl:"Рівень 2",
  body:[
    "Друзі вирішили поїхати на велосипедах до озера. Від будинку до озера 18 км. Першу годину вони їхали зі швидкістю 12 км/год. Потім у Тараса проколося колесо, і решту шляху друзі пройшли пішки зі швидкістю 4 км/год.",
    {q:"Скільки часу друзі добиралися до озера?"}
  ],
  tf:[
    {s:"Друзі проїхали на велосипедах 18 км.", a:"no", e:"18 км це весь шлях. На велосипедах їхали лише першу годину: 12 · 1 = 12 км."},
    {s:"Пішки друзі пройшли 6 км.", a:"yes", e:"Увесь шлях 18 км, на велосипедах 12 км: 18 − 12 = 6 км пішки."},
    {s:"Колесо проколося в усіх друзів.", a:"no", e:"У тексті сказано, що колесо проколося в Тараса. Про інших друзів цього не сказано."},
    {s:"Пішки друзі рухалися втричі повільніше, ніж на велосипедах.", a:"yes", e:"12 : 4 = 3. Швидкість пішки в 3 рази менша."}
  ],
  fill:{
    items:[
      ["Від будинку до озера ",{a:"c18"},"."],
      ["На велосипедах друзі їхали ",{a:"c1h"},"."],

const app = document.getElementById("app");
const STEPS = ["Правда чи неправда?","Встав пропуски","Обери відповідь","Порядок дій"];
const TFL = {yes:"Правда", no:"Неправда"};
let best = {};            // найкращий результат для кожного тексту (у межах сесії)
let S = null;             // поточний стан: {i, step, res:[{g,t}|null x4]}

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; };

function renderHome(){
  S = null;
  app.innerHTML = "";
  const intro = el("div","intro");
  intro.innerHTML = `<h2>Як працювати</h2>
    <p>Обери текст. Прочитай його повільно, можна двічі. Текст весь час буде перед очима.</p>
    <p>Тут є умови математичних задач і тексти з життя. До кожного тексту чотири завдання: перевір, чи правдиве твердження; встав числа в пропуски; обери правильну відповідь; розстав дії в потрібному порядку.</p>`;
  app.appendChild(intro);
  [["Умови задач", t=>t.kind==="task"],["Тексти з життя: оголошення, реклама, новини", t=>t.kind!=="task"]].forEach(([name,f])=>{
  app.appendChild(el("h2", name==="Умови задач"?"group":"group g2", name));
  const grid = el("div","grid");
  TEXTS.forEach((t,i)=>{
    if(!f(t)) return;
    const b = el("button","tcard k-"+t.kind);
    b.innerHTML = `<span class="kind">${t.label}</span><h3>${t.title}</h3><div class="lvl">${t.lvl}</div>` +
      (best[i] ? `<div class="done">✓ Пройдено: ${best[i].g} з ${best[i].t}</div>` : "");
    b.onclick = ()=>openText(i);
    grid.appendChild(b);
  });
  app.appendChild(grid);
  });
  window.scrollTo(0,0);
}

function textCardHTML(t){
  let h = `<div class="label">${t.label}</div>`;
  t.body.forEach(p=>{
    if(typeof p === "string") h += `<p>${p}</p>`;
    else if(p.q) h += `<p class="q">${p.q}</p>`;
    else if(p.head) h += `<p class="head">${p.head}</p>`;
    else if(p.paper) h += `<div class="paper">${p.paper}</div>`;
  });
  if(t.kind==="ad") h += `<div class="tabs"><span></span><span></span><span></span><span></span><span></span><span></span></div>`;
  return h;
}

function openText(i){
  S = {i, step:0, res:[null,null,null,null]};
  const t = TEXTS[i];
  app.innerHTML = "";
  const back = el("button","back","← До всіх текстів");
  back.onclick = renderHome;
  app.appendChild(back);
  const lay = el("div","layout");
  const card = el("aside","textcard k-"+t.kind, textCardHTML(t));
  const work = el("section","work"); work.id="work";
  lay.append(card, work);
  app.appendChild(lay);
  renderStep();
  window.scrollTo(0,0);
}

function stepper(){
  const s = el("div","stepper");
  STEPS.forEach((n,k)=>{
    const sp = el("span", k===S.step?"cur":(k<S.step?"past":""), `${k+1}. ${n}`);
    s.appendChild(sp);
  });
  return s;
}

function renderStep(){
  const w = document.getElementById("work");
  w.innerHTML = "";
  if(S.step>3){ renderSummary(w); return; }
  w.appendChild(stepper());
  const t = TEXTS[S.i];
  const ex = el("div","ex");
  ex.dataset.scope = "1";
  w.appendChild(ex);
  [buildTF, buildFill, buildMC, buildOrder][S.step](ex, t);
  if(window.innerWidth<=860) w.scrollIntoView({behavior:"smooth",block:"start"});
}

/* Спільна панель кнопок */
function controls(ex, onCheck, onRetry){
  const fb = el("div","fb");
  const bar = el("div","bar");
  const check = el("button","btn main","Перевірити");
  const retry = el("button","btn sec hidden","Спробувати ще раз");
  const next = el("button","btn main hidden", S.step===3 ? "Підсумок →" : "Далі →");
  bar.append(check, retry, next);
  ex.append(fb, bar);
  check.onclick = ()=>{
    const r = onCheck();
    if(!r) return;
    if(S.res[S.step]===null) S.res[S.step] = {g:r.g, t:r.t};
    if(r.g===r.t){
      fb.className="fb good"; fb.textContent = pick(["Усе правильно!","Чудово, жодної помилки!","Так тримати!"]);
      check.classList.add("hidden"); retry.classList.add("hidden");
    } else {
      fb.className="fb meh"; fb.textContent = `Правильно ${r.g} з ${r.t}. Прочитай пояснення, а потім спробуй ще раз.`;
      check.classList.add("hidden"); retry.classList.remove("hidden");
    }
    next.classList.remove("hidden");
  };
  retry.onclick = ()=>{ onRetry(); fb.textContent=""; fb.className="fb"; retry.classList.add("hidden"); check.classList.remove("hidden"); };
  next.onclick = ()=>{ S.step++; renderStep(); };
  return {fb};
}
const pick = a => a[Math.floor(Math.random()*a.length)];

/* 1. Так / Ні / Не сказано */
function buildTF(ex, t){
  ex.append(el("h2","","Завдання 1. Правда чи неправда?"));
  ex.append(el("p","how","Обери «Правда», якщо твердження точно випливає з тексту. Якщо в тексті сказано інакше або про це взагалі не сказано, обери «Неправда»."));
  const rows = t.tf.map(item=>{
    const row = el("div","tf");
    row.append(el("p","st",item.s));
    const opts = el("div","opts");
    ["yes","no"].forEach(v=>{
      const b = el("button","opt",TFL[v]);
      b.onclick = ()=>{ if(row.classList.contains("ok")) return; opts.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); b.classList.add("on"); row.dataset.v=v; row.classList.remove("bad","show"); };
      opts.appendChild(b);
    });
    row.append(opts, el("div","expl",item.e));
    ex.appendChild(row);
    return {row,item};
  });
  const c = controls(ex, ()=>{
    if(rows.some(r=>!r.row.dataset.v)){ c.fb.className="fb meh"; c.fb.textContent="Дай відповідь на кожне твердження."; return null; }
    let g=0;
    rows.forEach(({row,item})=>{
      const ok = row.dataset.v===item.a;
      row.classList.toggle("ok",ok); row.classList.toggle("bad",!ok); row.classList.add("show");
      if(ok) g++;
    });
    return {g,t:rows.length};
  }, ()=>{
    rows.forEach(({row})=>{ if(row.classList.contains("bad")){ row.classList.remove("bad","show"); delete row.dataset.v; row.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); } });
  });
}

/* Картки для перетягування */
function makeChip(c){ const ch = el("div","chip",c.t); ch.dataset.id=c.id; return ch; }

/* 2. Встав пропуски */
function buildFill(ex, t){
  ex.append(el("h2","","Завдання 2. Встав пропуски"));
  ex.append(el("p","how","Перетягни картки в пропуски. Можна й так: натисни на картку, а потім на пропуск. Деякі картки зайві."));
  const box = el("div");
  t.fill.items.forEach(parts=>{
    const p = el("p","sent");
    parts.forEach(x=>{
      if(typeof x==="string") p.append(document.createTextNode(x));
      else { const s=el("span","slot"); s.dataset.answer=x.a; p.append(s); }
    });
    box.appendChild(p);
  });
  ex.appendChild(box);
  const bank = el("div","bank");
  shuffle(t.fill.chips).forEach(c=>bank.appendChild(makeChip(c)));
  ex.appendChild(bank);
  const expl = el("div","fullexpl hidden","<b>Пояснення.</b> "+t.fill.e);
  const c = controls(ex, ()=>{
    const slots=[...box.querySelectorAll(".slot")];
    if(slots.some(s=>!s.querySelector(".chip"))){ c.fb.className="fb meh"; c.fb.textContent="Заповни всі пропуски."; return null; }
    let g=0;
    slots.forEach(s=>{
      const ch=s.querySelector(".chip"); const ok = ch.dataset.id===s.dataset.answer;
      s.classList.toggle("ok",ok); s.classList.toggle("bad",!ok);
      if(ok){ g++; s.classList.add("locked"); ch.classList.add("locked"); }
    });
    expl.classList.remove("hidden");
    return {g,t:slots.length};
  }, ()=>{
    box.querySelectorAll(".slot.bad").forEach(s=>{ const ch=s.querySelector(".chip"); if(ch) bank.appendChild(ch); s.classList.remove("bad"); });
  });
  ex.insertBefore(expl, ex.querySelector(".fb"));
}

/* 3. Обери відповідь */
function buildMC(ex, t){
  ex.append(el("h2","","Завдання 3. Обери відповідь"));
  ex.append(el("p","how","У кожному запитанні правильна лише одна відповідь. Перш ніж обрати, перечитай потрібне місце в тексті."));
  const qs = t.mc.map(m=>{
    const box = el("div","mcq");
    box.append(el("p","q",m.q));
    const opts = el("div","opts");
    shuffle(m.o).forEach(o=>{
      const b = el("button","opt",o); b.dataset.v=o;
      b.onclick = ()=>{ if(box.classList.contains("ok")) return; opts.querySelectorAll(".opt").forEach(x=>x.classList.remove("on","wrong")); b.classList.add("on"); box.dataset.v=o; box.classList.remove("bad","show"); };
      opts.appendChild(b);
    });
    box.append(opts, el("div","expl",m.e));
    ex.appendChild(box);
    return {box,m};
  });
  const c = controls(ex, ()=>{
    if(qs.some(q=>!q.box.dataset.v)){ c.fb.className="fb meh"; c.fb.textContent="Дай відповідь на кожне запитання."; return null; }
    let g=0;
    qs.forEach(({box,m})=>{
      const ok = box.dataset.v===m.a;
      box.classList.toggle("ok",ok); box.classList.toggle("bad",!ok); box.classList.add("show");
      const chosen = box.querySelector(".opt.on");
      chosen.classList.remove("on"); chosen.classList.add(ok?"right":"wrong");
      if(ok) g++;
    });
    return {g,t:qs.length};
  }, ()=>{
    qs.forEach(({box})=>{ if(box.classList.contains("bad")){ box.classList.remove("bad","show"); delete box.dataset.v; box.querySelectorAll(".opt").forEach(x=>x.classList.remove("on","wrong")); } });
  });
}

/* 4. Порядок дій */
function buildOrder(ex, t){
  const o = t.order;
  ex.append(el("h2","","Завдання 4. Порядок дій"));
  ex.append(el("p","how","Розстав дії в такому порядку, щоб розв’язати задачу. Одна дія зайва, її не використовуй. Обчислювати не потрібно."));
  ex.append(el("div","task-q","<b>Задача.</b> "+o.q));
  const list = el("div");
  o.steps.forEach((s,k)=>{
    const row = el("div","ord");
    row.append(el("div","n",String(k+1)), el("div","slot"));
    list.appendChild(row);
  });
  ex.appendChild(list);
  const bank = el("div","bank");
  shuffle(o.steps.concat(o.extra)).forEach(c=>bank.appendChild(makeChip(c)));
  ex.appendChild(bank);
  const map = {}; o.steps.forEach(s=>map[s.id]=s);
  const expl = el("div","fullexpl hidden","<b>Розв’язання.</b> "+o.e);
  const c = controls(ex, ()=>{
    const slots=[...list.querySelectorAll(".slot")];
    if(slots.some(s=>!s.querySelector(".chip"))){ c.fb.className="fb meh"; c.fb.textContent="Заповни всі місця."; return null; }
    const ids = slots.map(s=>s.querySelector(".chip").dataset.id);
    let g=0;
    slots.forEach((s,k)=>{
      const st = map[ids[k]];
      const ok = !!st && st.needs.every(n=>ids.slice(0,k).includes(n));
      s.classList.toggle("ok",ok); s.classList.toggle("bad",!ok);
      if(ok) g++;
    });
    expl.classList.remove("hidden");
    return {g,t:slots.length};
  }, ()=>{
    list.querySelectorAll(".slot.bad").forEach(s=>{ const ch=s.querySelector(".chip"); if(ch) bank.appendChild(ch); s.classList.remove("bad"); });
    list.querySelectorAll(".slot.ok").forEach(s=>s.classList.remove("ok"));
  });
  ex.insertBefore(expl, ex.querySelector(".fb"));
}

/* Підсумок */
function renderSummary(w){
  const g = S.res.reduce((a,r)=>a+(r?r.g:0),0);
  const tt = S.res.reduce((a,r)=>a+(r?r.t:0),0);
  if(!best[S.i] || g>best[S.i].g) best[S.i] = {g,t:tt};
  const ratio = tt ? g/tt : 0;
  const msg = ratio===1 ? "Бездоганно! Жодна деталь у тексті від тебе не сховалася."
            : ratio>=0.7 ? "Дуже добре! Подивись ще раз на завдання, де була помилка: там ховається підступ."
            : "Гарний початок. Перечитай текст повільно і пройди завдання ще раз. З кожним разом виходитиме краще.";
  const box = el("div","summary");
  box.innerHTML = `<h2>Підсумок: «${TEXTS[S.i].title}»</h2>
    <div class="big">${g} з ${tt}</div><p>${msg}</p>
    <table>${STEPS.map((n,k)=>`<tr><td>${k+1}. ${n}</td><td>${S.res[k]?S.res[k].g+" з "+S.res[k].t:"—"}</td></tr>`).join("")}</table>
    <p style="font-size:15px;color:#6B6E5C">Рахуємо відповіді з першої спроби.</p>`;
  const bar = el("div","bar");
  const again = el("button","btn sec","Пройти ще раз");
  again.onclick = ()=>openText(S.i);
  bar.appendChild(again);
  if(S.i < TEXTS.length-1){ const nx = el("button","btn main","Наступний текст →"); const ni=S.i+1; nx.onclick=()=>openText(ni); bar.appendChild(nx); }
  const home = el("button","btn sec","До всіх текстів"); home.onclick=renderHome; bar.appendChild(home);
  box.appendChild(bar);
  w.appendChild(box);
}

/* =====================================================================
   ПЕРЕТЯГУВАННЯ (миша, палець, стилус) + режим «натисни і постав»
   ===================================================================== */
let drag = null, sel = null;
function clearSel(){ if(sel){ sel.classList.remove("selected"); sel=null; } }
function clearHover(){ document.querySelectorAll(".hover").forEach(x=>x.classList.remove("hover")); }
function scopeOf(n){ return n.closest("[data-scope]"); }

function place(chip, tgt){
  const scope = scopeOf(chip);
  if(!tgt || scopeOf(tgt)!==scope || tgt.classList.contains("locked") || chip.classList.contains("locked")) return;
  const from = chip.parentElement;
  if(tgt.classList.contains("slot")){
    if(from===tgt) return;
    const other = tgt.querySelector(".chip");
    if(other){
      if(other.classList.contains("locked")) return;
      (from.classList.contains("slot") ? from : scope.querySelector(".bank")).appendChild(other);
    }
    tgt.appendChild(chip);
  } else {
    tgt.appendChild(chip);
  }
  [tgt, from].forEach(x=>x.classList && x.classList.remove("ok","bad"));
}

document.addEventListener("pointerdown", e=>{
  const chip = e.target.closest(".chip");
  if(!chip || chip.classList.contains("locked")) return;
  drag = {chip, x:e.clientX, y:e.clientY, ghost:null};
});
document.addEventListener("pointermove", e=>{
  if(!drag) return;
  if(!drag.ghost){
    if(Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 6) return;
    const r = drag.chip.getBoundingClientRect();
    const g = drag.chip.cloneNode(true);
    g.classList.add("ghost"); g.classList.remove("selected");
    g.style.width = r.width+"px";
    document.body.appendChild(g);
    drag.ghost=g; drag.ox=drag.x-r.left; drag.oy=drag.y-r.top;
    drag.chip.classList.add("placeholder");
    clearSel();
  }
  drag.ghost.style.left=(e.clientX-drag.ox)+"px";
  drag.ghost.style.top=(e.clientY-drag.oy)+"px";
  clearHover();
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const tgt = under && under.closest(".slot,.bank");
  if(tgt && scopeOf(tgt)===scopeOf(drag.chip) && !tgt.classList.contains("locked")) tgt.classList.add("hover");
  e.preventDefault();
}, {passive:false});
function endDrag(e, cancelled){
  if(!drag) return;
  const d = drag; drag = null;
  if(d.ghost){
    d.ghost.remove(); d.chip.classList.remove("placeholder"); clearHover();
    if(!cancelled){
      const under = document.elementFromPoint(e.clientX, e.clientY);
      place(d.chip, under && under.closest(".slot,.bank"));
    }
    d.justDragged = true;
  } else if(!cancelled){
    // Натискання на картку
    if(sel && sel!==d.chip && d.chip.parentElement.classList.contains("slot") && scopeOf(sel)===scopeOf(d.chip)){
      place(sel, d.chip.parentElement); clearSel();
    } else if(sel===d.chip){ clearSel(); }
    else { clearSel(); sel=d.chip; sel.classList.add("selected"); }
  }
}
document.addEventListener("pointerup", e=>endDrag(e,false));
document.addEventListener("pointercancel", e=>endDrag(e,true));
document.addEventListener("click", e=>{
  if(!sel || e.target.closest(".chip")) return;
  const tgt = e.target.closest(".slot,.bank");
  if(tgt){ place(sel, tgt); clearSel(); }
});

renderHome();
</script>
