<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nadia School — Симуляції з математики</title>
  <style>
    :root {
      --bg-main: #141713;
      --bg-card: rgba(36, 42, 33, 0.85);
      --bg-card-hover: rgba(48, 56, 44, 0.95);
      --border-color: rgba(255, 255, 255, 0.15);
      --accent: #b7e4c7;
      --text-main: #f4f6f0;
      --text-sub: #b2bdae;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      background-color: #1a1e18;
      background: linear-gradient(rgba(18, 20, 16, 0.85), rgba(18, 20, 16, 0.9)), 
                  url('./bg_videos.jpg') no-repeat center center / cover;
      background-attachment: fixed;
    }
    .container { width: 100%; max-width: 600px; }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 25px;
      background: rgba(0, 0, 0, 0.35);
      padding: 8px 16px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
    }
    .back-link:hover { background: rgba(0, 0, 0, 0.6); color: var(--accent); }
    .page-title { font-size: 30px; font-weight: 800; margin-bottom: 6px; color: #fff; }
    .page-desc { color: var(--text-sub); font-size: 15px; margin-bottom: 28px; }
    .list { display: flex; flex-direction: column; gap: 14px; }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px 22px;
      text-decoration: none;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(12px);
      transition: all 0.25s ease;
    }
    .card:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(183, 228, 199, 0.2);
    }
    .card-left { display: flex; align-items: center; gap: 16px; }
    .card-icon {
      font-size: 24px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      flex-shrink: 0;
    }
    .card-title { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 3px; }
    .card-desc { font-size: 13px; color: var(--text-sub); }
    .card-arrow { color: var(--accent); font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <a href="math.html" class="back-link">&larr; До розділу Математика</a>
    <h1 class="page-title">📐 Симуляції з математики</h1>
    <p class="page-desc">Інтерактивні числові моделі та тренажери:</p>

    <div class="list">
      <!-- Посилання на вашу нову симуляцію -->
      <a href="simulatios/math/rational_numbers/1/index.html" class="card">
        <div class="card-left">
          <div class="card-icon">🔢</div>
          <div>
            <div class="card-title">Додавання та віднімання на числовій осі</div>
            <div class="card-desc">Раціональні числа: інтерактивна координатна пряма</div>
            
          </div>
        </div>
        <div class="card-arrow">&rarr;</div>
      </a>
      <a href="simulatios/math/quadratic_function/1/index.html" class="card">
        <div class="card-left">
          <div class="card-icon">📈</div>
          <div>
            <div class="card-title">Квадратична функція (v1)</div>
            <div class="card-desc">Дослідження параболи, коефіцієнтів та вершини функції</div>
          </div>
        </div>
        <div class="card-arrow">&rarr;</div>
      </a>
  </div>
  </div>
</body>
</html>
