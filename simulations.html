<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nadia School — Симуляції</title>
  <style>
    :root {
      --accent: #5ce1e6;
      --card-bg: rgba(23, 33, 46, 0.75);
      --card-hover: rgba(33, 47, 66, 0.9);
      --border-color: rgba(255, 255, 255, 0.15);
      --text-main: #f0f2f5;
      --text-sub: #b2c3d4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #28394e;
      background-image: url('bg_simulations.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(18, 27, 39, 0.4);
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 580px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 25px;
      background: rgba(0, 0, 0, 0.25);
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
    }
    .back-link:hover {
      background: rgba(0, 0, 0, 0.45);
      color: var(--accent);
    }
    .page-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 6px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    }
    .page-desc {
      color: var(--text-sub);
      font-size: 14px;
      margin-bottom: 28px;
    }
    .list { display: flex; flex-direction: column; gap: 14px; }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px 22px;
      text-decoration: none;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
    }
    .card:hover {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(92, 225, 230, 0.2);
    }
    .card-left { display: flex; align-items: center; gap: 16px; }
    .card-icon {
      font-size: 24px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      flex-shrink: 0;
    }
    .card-title { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 3px; }
    .card-desc { font-size: 13px; color: var(--text-sub); }
    .card-arrow { color: var(--accent); font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">&larr; На головну</a>
    <h1 class="page-title">🧪 Симуляції</h1>
    <p class="page-desc">Інтерактивні фізичні моделі для дослідів:</p>

    <div class="list">
      <a href="simulatios/1/" class="card">
        <div class="card-left">
          <div class="card-icon">🪢</div>
          <div>
            <div class="card-title">Сила пружності</div>
            <div class="card-desc">Закон Гука та взаємодія тіл</div>
          </div>
        </div>
        <div class="card-arrow">&rarr;</div>
      </a>

      <a href="simulatios/2/" class="card">
        <div class="card-left">
          <div class="card-icon">⚛️</div>
          <div>
            <div class="card-title">Дифузія часток</div>
            <div class="card-desc">Тепловий рух часток та експорт у GIF</div>
          </div>
        </div>
        <div class="card-arrow">&rarr;</div>
      </a>
    </div>
  </div>
</body>
</html>
