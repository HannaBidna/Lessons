<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зсуви графіка параболи: y = (x + m)² + n</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', 'Segoe UI', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0e1c36 0%, #060b14 100%);
            color: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .simulation-card {
            background: #0a1324;
            width: 100%;
            max-width: 620px;
            padding: 20px 24px;
            border-radius: 18px;
            border: 1.5px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(14, 165, 233, 0.12);
        }

        h1 {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.2);
        }

        /* Табло рівняння */
        .math-display {
            text-align: center;
            font-size: 30px;
            font-weight: 900;
            margin-bottom: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            user-select: none;
            flex-wrap: wrap;
        }

        .symbol { color: #FFFFFF; }
        .var-y { color: #38BDF8; }
        .shift-m { color: #C084FC; text-shadow: 0 0 12px rgba(192, 132, 252, 0.8); }
        .shift-n { color: #FACC15; text-shadow: 0 0 12px rgba(250, 204, 21, 0.8); }
        .power { font-size: 18px; vertical-align: super; }

        /* Пояснювальна підказка для учнів */
        .rule-hint {
            min-height: 20px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: #38BDF8;
            margin-bottom: 10px;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        /* Квадратна площина */
        .canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 460px;
            aspect-ratio: 1 / 1;
            margin: 0 auto 16px auto;
            background: #030712;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Блок повзунків */
        .controls-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 700;
        }

        .title-m { color: #C084FC; }
        .title-n { color: #FACC15; }

        .slider-row {
            display: grid;
            grid-template-columns: 1fr 50px;
            align-items: center;
            gap: 12px;
        }

        .slider-val-box {
            font-size: 16px;
            font-weight: 800;
            text-align: right;
            color: #F8FAFC;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #111e3b;
            border-radius: 3px;
            outline: none;
            border: 1px solid #1E293B;
        }

        /* Повзунок по горизонталі (m) */
        input#sliderM::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: radial-gradient(circle, #FFF 30%, #C084FC 80%);
            cursor: pointer;
            box-shadow: 0 0 8px #C084FC;
            border: 2px solid #FFF;
        }

        /* Повзунок по вертикалі (n) */
        input#sliderN::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: radial-gradient(circle, #FFF 30%, #FACC15 80%);
            cursor: pointer;
            box-shadow: 0 0 8px #FACC15;
            border: 2px solid #FFF;
        }

        /* Підвал з легендою та кнопкою */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .legend {
            display: flex;
            gap: 12px;
            font-size: 11px;
            font-weight: 700;
            color: #94A3B8;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }

        .legend-line-base {
            width: 14px;
            height: 2px;
            border-top: 2px dashed rgba(255, 255, 255, 0.4);
        }

        .btn-reset {
            background: linear-gradient(180deg, #FFFFFF 0%, #E2E8F0 60%, #CBD5E1 100%);
            color: #0F172A;
            border: none;
            padding: 7px 16px;
            font-size: 13px;
            font-weight: 800;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.8);
            transition: filter 0.2s, transform 0.1s;
        }

        .btn-reset:hover {
            filter: brightness(1.08);
        }

        .btn-reset:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

<div class="simulation-card">
    <h1>Зсуви параболи по площині</h1>

    <div class="math-display" id="mathDisplay"></div>
    <div class="rule-hint" id="ruleHint"></div>

    <div class="canvas-wrapper">
        <canvas id="graphCanvas" width="500" height="500"></canvas>
    </div>

    <div class="controls-grid">
        <!-- По горизонталі -->
        <div class="control-group">
            <div class="control-header title-m">
                <span>Зсув по горизонталі (m): рух ліворуч / праворуч</span>
            </div>
            <div class="slider-row">
                <input type="range" id="sliderM" min="-6" max="6" step="0.5" value="0">
                <div class="slider-val-box shift-m" id="valM">0.0</div>
            </div>
        </div>

        <!-- По вертикалі -->
        <div class="control-group">
            <div class="control-header title-n">
                <span>Зсув по вертикалі (n): рух вгору / вниз</span>
            </div>
            <div class="slider-row">
                <input type="range" id="sliderN" min="-6" max="6" step="0.5" value="0">
                <div class="slider-val-box shift-n" id="valN">0.0</div>
            </div>
        </div>
    </div>

    <div class="bottom-bar">
        <div class="legend">
            <div class="legend-item">
                <div class="legend-line-base"></div>
                <span>Базова y = x²</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #4ADE80; box-shadow: 0 0 5px #4ADE80;"></div>
                <span>Вершина</span>
            </div>
        </div>
        <button class="btn-reset" id="resetBtn">Скинути (y = x²)</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');

    const sliderM = document.getElementById('sliderM');
    const sliderN = document.getElementById('sliderN');
    const valM = document.getElementById('valM');
    const valN = document.getElementById('valN');
    const mathDisplay = document.getElementById('mathDisplay');
    const ruleHint = document.getElementById('ruleHint');
    const resetBtn = document.getElementById('resetBtn');

    // Квадратний масштаб: симетрично від -10 до 10
    const RANGE = 10;
    const MIN_X = -RANGE, MAX_X = RANGE;
    const MIN_Y = -RANGE, MAX_Y = RANGE;

    function toScreenX(x) {
        return ((x - MIN_X) / (MAX_X - MIN_X)) * canvas.width;
    }

    function toScreenY(y) {
        return canvas.height - ((y - MIN_Y) / (MAX_Y - MIN_Y)) * canvas.height;
    }

    function formatNumber(n) {
        return Number.isInteger(n) ? n.toString() : n.toFixed(1);
    }

    function updateEquation(m, n) {
        valM.textContent = (m > 0 ? '+' : '') + formatNumber(m);
        valN.textContent = (n > 0 ? '+' : '') + formatNumber(n);

        // Пояснювальний текст для розуміння знаків
        let hintParts = [];
        if (m > 0) hintParts.push(`дужка (+${formatNumber(m)}) зміщує ліворуч на ${formatNumber(m)}`);
        else if (m < 0) hintParts.push(`дужка (${formatNumber(m)}) зміщує праворуч на ${formatNumber(Math.abs(m))}`);

        if (n > 0) hintParts.push(`хвіст (+${formatNumber(n)}) підіймає вгору на ${formatNumber(n)}`);
        else if (n < 0) hintParts.push(`хвіст (${formatNumber(n)}) опускає вниз на ${formatNumber(Math.abs(n))}`);

        ruleHint.textContent = hintParts.length > 0 ? '💡 ' + hintParts.join(' • ') : '💡 Початкове положення у центрі координат';

        // Генерація виразу y = (x + m)² + n
        let html = '<span class="var-y">y</span> <span class="symbol">=</span> ';

        if (m === 0) {
            html += '<span class="symbol">x</span><span class="power">2</span>';
        } else {
            let mSign = m > 0 ? '+' : '-';
            let mVal = formatNumber(Math.abs(m));
            html += `<span class="symbol">(x</span> <span class="shift-m">${mSign} ${mVal}</span><span class="symbol">)</span><span class="power">2</span>`;
        }

        if (n !== 0) {
            let nSign = n > 0 ? '+' : '-';
            let nVal = formatNumber(Math.abs(n));
            html += ` <span class="shift-n">${nSign} ${nVal}</span>`;
        }

        mathDisplay.innerHTML = html;
    }

    function drawPoint(x, y, color, label = '') {
        const sx = toScreenX(x);
        const sy = toScreenY(y);

        ctx.save();
        ctx.shadowColor = color;
        ctx.shadowBlur = 8;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(sx, sy, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(sx, sy, 2, 0, Math.PI * 2);
        ctx.fill();

        if (label) {
            ctx.shadowBlur = 0;
            ctx.font = 'bold 10px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const textWidth = ctx.measureText(label).width;
            const padX = 4;
            const padY = 2;
            const offsetY = 14;

            ctx.fillStyle = 'rgba(6, 11, 20, 0.85)';
            ctx.fillRect(sx - textWidth / 2 - padX, sy + offsetY - 6 - padY, textWidth + padX * 2, 12 + padY * 2);

            ctx.fillStyle = '#FFFFFF';
            ctx.fillText(label, sx, sy + offsetY);
        }
        ctx.restore();
    }

    function drawParabolaCurve(calcY, color, isDashed = false, lineWidth = 2.5, glow = false) {
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = lineWidth;
        if (isDashed) ctx.setLineDash([4, 4]);
        if (glow) {
            ctx.shadowColor = color;
            ctx.shadowBlur = 8;
        }

        ctx.beginPath();
        let isStarted = false;
        const step = (MAX_X - MIN_X) / canvas.width;

        for (let x = MIN_X; x <= MAX_X; x += step) {
            const y = calcY(x);
            const sx = toScreenX(x);
            const sy = toScreenY(y);

            if (!isStarted) {
                ctx.moveTo(sx, sy);
                isStarted = true;
            } else {
                ctx.lineTo(sx, sy);
            }
        }
        ctx.stroke();
        ctx.restore();
    }

    function draw() {
        const m = parseFloat(sliderM.value);
        const n = parseFloat(sliderN.value);

        updateEquation(m, n);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Квадратна сітка
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.08)';
        ctx.lineWidth = 1;

        for (let i = -RANGE; i <= RANGE; i++) {
            ctx.beginPath();
            ctx.moveTo(toScreenX(i), 0);
            ctx.lineTo(toScreenX(i), canvas.height);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, toScreenY(i));
            ctx.lineTo(canvas.width, toScreenY(i));
            ctx.stroke();
        }

        // 2. Головні осі
        ctx.save();
        ctx.strokeStyle = '#38BDF8';
        ctx.shadowColor = 'rgba(56, 189, 248, 0.35)';
        ctx.shadowBlur = 4;
        ctx.lineWidth = 1.6;

        // Вісь X
        ctx.beginPath();
        ctx.moveTo(0, toScreenY(0));
        ctx.lineTo(canvas.width, toScreenY(0));
        ctx.stroke();

        // Вісь Y
        ctx.beginPath();
        ctx.moveTo(toScreenX(0), 0);
        ctx.lineTo(toScreenX(0), canvas.height);
        ctx.stroke();
        ctx.restore();

        // 3. Підписи осей
        ctx.font = 'bold 10px Arial';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';

        for (let x = MIN_X; x <= MAX_X; x += 2) {
            if (x !== 0) {
                ctx.fillText(x, toScreenX(x), toScreenY(0) + 4);
            }
        }

        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        for (let y = MIN_Y; y <= MAX_Y; y += 2) {
            if (y !== 0) {
                ctx.fillText(y, toScreenX(0) - 4, toScreenY(y));
            }
        }

        // 4. Початкова парабола y = x² (пунктир для порівняння)
        drawParabolaCurve(x => x * x, 'rgba(255, 255, 255, 0.25)', true, 1.6, false);

        // 5. Зміщена парабола y = (x + m)² + n
        drawParabolaCurve(x => Math.pow(x + m, 2) + n, '#38BDF8', false, 2.8, true);

        // 6. Вершина параболи: V(-m; n)
        const vx = -m;
        const vy = n;
        if (vx >= MIN_X && vx <= MAX_X && vy >= MIN_Y && vy <= MAX_Y) {
            drawPoint(vx, vy, '#4ADE80', `V(${formatNumber(vx)}; ${formatNumber(vy)})`);
        }
    }

    [sliderM, sliderN].forEach(slider => {
        slider.addEventListener('input', draw);
    });

    resetBtn.addEventListener('click', () => {
        sliderM.value = 0;
        sliderN.value = 0;
        draw();
    });

    draw();
</script>

</body>
</html>
