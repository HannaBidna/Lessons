<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рівняння прямої: y = kx + b</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', 'Segoe UI', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0e1c36 0%, #060b14 100%);
            color: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .simulation-card {
            background: #0a1324;
            width: 100%;
            max-width: 600px;
            padding: 20px 24px;
            border-radius: 18px;
            border: 1.5px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(14, 165, 233, 0.12);
        }

        h1 {
            text-align: center;
            font-size: 18px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.2);
        }

        /* Табло рівняння */
        .math-display {
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            user-select: none;
            flex-wrap: wrap;
        }

        .symbol { color: #FFFFFF; }
        .var-y { color: #38BDF8; }
        .coef-k { color: #F43F5E; text-shadow: 0 0 10px rgba(244, 63, 94, 0.8); }
        .coef-b { color: #FACC15; text-shadow: 0 0 10px rgba(250, 204, 21, 0.8); }

        /* Пояснювальна підказка */
        .slope-hint {
            min-height: 18px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: #38BDF8;
            margin-bottom: 8px;
            text-shadow: 0 0 6px rgba(56, 189, 248, 0.4);
        }

        /* Квадратна площина */
        .canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 1 / 1;
            margin: 0 auto 14px auto;
            background: #030712;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Елементи керування */
        .controls-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slider-row {
            display: grid;
            grid-template-columns: 24px 1fr 48px;
            align-items: center;
            gap: 12px;
        }

        .slider-row label {
            font-size: 16px;
            font-weight: 900;
            text-align: center;
        }

        .label-k { color: #F43F5E; }
        .label-b { color: #FACC15; }

        .slider-val-box {
            font-size: 14px;
            font-weight: 800;
            text-align: right;
            color: #F8FAFC;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #111e3b;
            border-radius: 3px;
            outline: none;
            border: 1px solid #1E293B;
        }

        input#sliderK::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: radial-gradient(circle, #FFF 30%, #F43F5E 80%);
            cursor: pointer;
            box-shadow: 0 0 8px #F43F5E;
            border: 2px solid #FFF;
        }

        input#sliderB::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: radial-gradient(circle, #FFF 30%, #FACC15 80%);
            cursor: pointer;
            box-shadow: 0 0 8px #FACC15;
            border: 2px solid #FFF;
        }

        /* Підвал */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .legend {
            display: flex;
            gap: 12px;
            font-size: 11px;
            font-weight: 700;
            color: #94A3B8;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }

        .btn-reset {
            background: linear-gradient(180deg, #FFFFFF 0%, #E2E8F0 60%, #CBD5E1 100%);
            color: #0F172A;
            border: none;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 800;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.8);
            transition: filter 0.2s, transform 0.1s;
        }

        .btn-reset:hover {
            filter: brightness(1.08);
        }

        .btn-reset:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

<div class="simulation-card">
    <h1>Рівняння прямої y = kx + b</h1>

    <div class="math-display" id="mathDisplay"></div>
    <div class="slope-hint" id="slopeHint"></div>

    <div class="canvas-wrapper">
        <canvas id="graphCanvas" width="500" height="500"></canvas>
    </div>

    <div class="controls-grid">
        <div class="slider-row">
            <label for="sliderK" class="label-k">k</label>
            <input type="range" id="sliderK" min="-5" max="5" step="0.5" value="1">
            <div class="slider-val-box coef-k" id="valK">1.0</div>
        </div>
        <div class="slider-row">
            <label for="sliderB" class="label-b">b</label>
            <input type="range" id="sliderB" min="-8" max="8" step="0.5" value="0">
            <div class="slider-val-box coef-b" id="valB">0.0</div>
        </div>
    </div>

    <div class="bottom-bar">
        <div class="legend">
            <div class="legend-item">
                <div class="legend-dot" style="background: #FACC15; box-shadow: 0 0 5px #FACC15;"></div>
                <span>Зсув (0; b)</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background: #F43F5E; box-shadow: 0 0 5px #F43F5E;"></div>
                <span>Нахил k</span>
            </div>
        </div>
        <button class="btn-reset" id="resetBtn">Скинути (y = x)</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');

    const sliderK = document.getElementById('sliderK');
    const sliderB = document.getElementById('sliderB');
    const valK = document.getElementById('valK');
    const valB = document.getElementById('valB');
    const mathDisplay = document.getElementById('mathDisplay');
    const slopeHint = document.getElementById('slopeHint');
    const resetBtn = document.getElementById('resetBtn');

    const RANGE = 10;
    const MIN_X = -RANGE, MAX_X = RANGE;
    const MIN_Y = -RANGE, MAX_Y = RANGE;

    let draggingPoint = null; // 'b' або 'k'

    function toScreenX(x) {
        return ((x - MIN_X) / (MAX_X - MIN_X)) * canvas.width;
    }

    function toScreenY(y) {
        return canvas.height - ((y - MIN_Y) / (MAX_Y - MIN_Y)) * canvas.height;
    }

    function toMathX(px) {
        return MIN_X + (px / canvas.width) * (MAX_X - MIN_X);
    }

    function toMathY(py) {
        return MAX_Y - (py / canvas.height) * (MAX_Y - MIN_Y);
    }

    function formatNumber(n) {
        return Number.isInteger(n) ? n.toString() : n.toFixed(1);
    }

    function updateEquation(k, b) {
        valK.textContent = formatNumber(k);
        valB.textContent = formatNumber(b);

        if (k > 0) {
            slopeHint.textContent = `📈 k = ${formatNumber(k)} > 0: пряма підіймається вгору (зліва направо)`;
        } else if (k < 0) {
            slopeHint.textContent = `📉 k = ${formatNumber(k)} < 0: пряма спускається вниз (зліва направо)`;
        } else {
            slopeHint.textContent = '➡️ k = 0: пряма горизонтальна (паралельна осі X)';
        }

        let html = '<span class="var-y">y</span> <span class="symbol">=</span> ';

        if (k === 0 && b === 0) {
            html += '<span class="symbol">0</span>';
            mathDisplay.innerHTML = html;
            return;
        }

        let parts = [];

        if (k !== 0) {
            let kStr = '';
            if (k === -1) kStr = '-';
            else if (k !== 1) kStr = formatNumber(k);
            parts.push(`<span class="coef-k">${kStr}x</span>`);
        }

        if (b !== 0) {
            let sign = b > 0 ? (parts.length > 0 ? '+ ' : '') : '- ';
            parts.push(`${sign}<span class="coef-b">${formatNumber(Math.abs(b))}</span>`);
        }

        mathDisplay.innerHTML = html + parts.join(' ');
    }

    function drawInteractiveHandle(x, y, color, label = '', position = 'top') {
        const sx = toScreenX(x);
        const sy = toScreenY(y);

        ctx.save();
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(sx, sy, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(sx, sy, 2.5, 0, Math.PI * 2);
        ctx.fill();

        if (label) {
            ctx.shadowBlur = 0;
            ctx.font = 'bold 10px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const textWidth = ctx.measureText(label).width;
            const padX = 4;
            const padY = 2;
            const offsetY = position === 'top' ? -14 : 14;

            ctx.fillStyle = 'rgba(6, 11, 20, 0.85)';
            ctx.fillRect(sx - textWidth / 2 - padX, sy + offsetY - 6 - padY, textWidth + padX * 2, 12 + padY * 2);

            ctx.fillStyle = '#FFFFFF';
            ctx.fillText(label, sx, sy + offsetY);
        }
        ctx.restore();
    }

    function drawSlopeTriangle(k, b) {
        if (k === 0) return;

        const x0 = 1;
        const x1 = 3;
        const y0 = k * x0 + b;
        const y1 = k * x1 + b;

        const sx0 = toScreenX(x0);
        const sy0 = toScreenY(y0);
        const sx1 = toScreenX(x1);
        const sy1 = toScreenY(y1);
        const cornerY = sy0;

        // Заливка трикутника нахилу
        ctx.save();
        ctx.fillStyle = 'rgba(244, 63, 94, 0.15)';
        ctx.beginPath();
        ctx.moveTo(sx0, sy0);
        ctx.lineTo(sx1, cornerY);
        ctx.lineTo(sx1, sy1);
        ctx.closePath();
        ctx.fill();

        // Катети трикутника
        ctx.strokeStyle = 'rgba(244, 63, 94, 0.7)';
        ctx.setLineDash([3, 3]);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(sx0, sy0);
        ctx.lineTo(sx1, cornerY);
        ctx.lineTo(sx1, sy1);
        ctx.stroke();

        // Підпис Δx = 2
        ctx.font = 'bold 9px Arial';
        ctx.fillStyle = '#C084FC';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText('+2', (sx0 + sx1) / 2, cornerY + 3);

        // Підпис Δy = 2k
        const dyVal = formatNumber(2 * k);
        ctx.fillStyle = '#F43F5E';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText((k > 0 ? '+' : '') + dyVal, sx1 + 4, (cornerY + sy1) / 2);

        ctx.restore();
    }

    function draw() {
        const k = parseFloat(sliderK.value);
        const b = parseFloat(sliderB.value);

        updateEquation(k, b);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Координатна сітка
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.08)';
        ctx.lineWidth = 1;

        for (let i = -RANGE; i <= RANGE; i++) {
            ctx.beginPath();
            ctx.moveTo(toScreenX(i), 0);
            ctx.lineTo(toScreenX(i), canvas.height);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, toScreenY(i));
            ctx.lineTo(canvas.width, toScreenY(i));
            ctx.stroke();
        }

        // 2. Осі координат
        ctx.save();
        ctx.strokeStyle = '#38BDF8';
        ctx.shadowColor = 'rgba(56, 189, 248, 0.35)';
        ctx.shadowBlur = 4;
        ctx.lineWidth = 1.6;

        ctx.beginPath();
        ctx.moveTo(0, toScreenY(0));
        ctx.lineTo(canvas.width, toScreenY(0));
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(toScreenX(0), 0);
        ctx.lineTo(toScreenX(0), canvas.height);
        ctx.stroke();
        ctx.restore();

        // 3. Підписи осей
        ctx.font = 'bold 10px Arial';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';

        for (let x = MIN_X; x <= MAX_X; x += 2) {
            if (x !== 0) {
                ctx.fillText(x, toScreenX(x), toScreenY(0) + 4);
            }
        }

        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        for (let y = MIN_Y; y <= MAX_Y; y += 2) {
            if (y !== 0) {
                ctx.fillText(y, toScreenX(0) - 4, toScreenY(y));
            }
        }

        // 4. Трикутник нахилу
        drawSlopeTriangle(k, b);

        // 5. Пряма лінія
        ctx.save();
        ctx.strokeStyle = '#38BDF8';
        ctx.shadowColor = '#0EA5E9';
        ctx.shadowBlur = 8;
        ctx.lineWidth = 2.6;

        const yLeft = k * MIN_X + b;
        const yRight = k * MAX_X + b;

        ctx.beginPath();
        ctx.moveTo(toScreenX(MIN_X), toScreenY(yLeft));
        ctx.lineTo(toScreenX(MAX_X), toScreenY(yRight));
        ctx.stroke();
        ctx.restore();

        // 6. Інтерактивні точки-маркери
        // Точка перетину з Y: (0; b)
        drawInteractiveHandle(0, b, '#FACC15', `(0; ${formatNumber(b)})`, 'left');

        // Точка керування кутом нахилу k: беремо x = 4
        const handleX = 4;
        const handleY = k * handleX + b;
        if (handleY >= MIN_Y - 2 && handleY <= MAX_Y + 2) {
            drawInteractiveHandle(handleX, handleY, '#F43F5E', 'Тягни кут', 'top');
        }
    }

    // Логіка перетягування точок мишкою / пальцем на полотні
    function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY
        };
    }

    function onPointerDown(e) {
        const coords = getCanvasCoords(e);
        const mathX = toMathX(coords.x);
        const mathY = toMathY(coords.y);

        const k = parseFloat(sliderK.value);
        const b = parseFloat(sliderB.value);

        // Перевірка кліку по точці b (0; b)
        const distB = Math.hypot(coords.x - toScreenX(0), coords.y - toScreenY(b));
        if (distB < 25) {
            draggingPoint = 'b';
            return;
        }

        // Перевірка кліку по точці k (4; 4k + b)
        const handleX = 4;
        const handleY = k * handleX + b;
        const distK = Math.hypot(coords.x - toScreenX(handleX), coords.y - toScreenY(handleY));
        if (distK < 25) {
            draggingPoint = 'k';
            return;
        }
    }

    function onPointerMove(e) {
        if (!draggingPoint) {
            // Зміна курсора при наведенні
            const coords = getCanvasCoords(e);
            const k = parseFloat(sliderK.value);
            const b = parseFloat(sliderB.value);
            const distB = Math.hypot(coords.x - toScreenX(0), coords.y - toScreenY(b));
            const distK = Math.hypot(coords.x - toScreenX(4), coords.y - toScreenY(k * 4 + b));
            canvas.style.cursor = (distB < 20 || distK < 20) ? 'grab' : 'crosshair';
            return;
        }

        canvas.style.cursor = 'grabbing';
        const coords = getCanvasCoords(e);
        const mathX = toMathX(coords.x);
        const mathY = toMathY(coords.y);

        if (draggingPoint === 'b') {
            let newB = Math.round(mathY * 2) / 2;
            newB = Math.max(-8, Math.min(8, newB));
            sliderB.value = newB;
            draw();
        } else if (draggingPoint === 'k') {
            const b = parseFloat(sliderB.value);
            let newK = (mathY - b) / 4;
            newK = Math.round(newK * 2) / 2;
            newK = Math.max(-5, Math.min(5, newK));
            sliderK.value = newK;
            draw();
        }
    }

    function onPointerUp() {
        draggingPoint = null;
        canvas.style.cursor = 'default';
    }

    // Слухачі подій для Canvas
    canvas.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    canvas.addEventListener('touchstart', onPointerDown, { passive: false });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);

    // Слухачі для повзунків
    sliderK.addEventListener('input', draw);
    sliderB.addEventListener('input', draw);

    resetBtn.addEventListener('click', () => {
        sliderK.value = 1;
        sliderB.value = 0;
        draw();
    });

    draw();
</script>

</body>
</html>
