<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Фігури та розгортки для вирізання</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', 'Segoe UI', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0e1c36 0%, #060b14 100%);
            color: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .simulation-card {
            background: #0a1324;
            width: 100%;
            max-width: 820px;
            padding: 20px 24px;
            border-radius: 18px;
            border: 1.5px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(14, 165, 233, 0.12);
        }

        h1 {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: 0.3px;
            margin-bottom: 12px;
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.2);
        }

        /* Меню фігур */
        .shape-nav {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .btn-shape {
            background: #08152e;
            color: #94A3B8;
            border: 1px solid #1E293B;
            padding: 7px 14px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-shape:hover {
            border-color: #38BDF8;
            color: #F8FAFC;
        }

        .btn-shape.active {
            background: #1e293b;
            color: #38BDF8;
            border-color: #38BDF8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        /* Подвійна панель: 3D + 2D Розгортка */
        .views-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 14px;
        }

        .panel-box {
            position: relative;
            background: #030712;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            aspect-ratio: 1 / 1;
        }

        .panel-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(8, 21, 46, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 800;
            color: #38BDF8;
            z-index: 5;
            user-select: none;
        }

        .canvas-3d {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        .canvas-3d:active {
            cursor: grabbing;
        }

        .canvas-2d {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Інфо-панель */
        .info-panel {
            background: #08152e;
            border-left: 3px solid #38BDF8;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.4;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .info-title {
            font-weight: 800;
            color: #38BDF8;
            margin-bottom: 2px;
        }

        .info-desc {
            color: #CBD5E1;
        }

        @media (max-width: 600px) {
            .views-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div class="simulation-card">
    <h1>Геометричні тіла та розгортки для вирізання</h1>

    <div class="shape-nav" id="shapeNav">
        <button class="btn-shape active" data-shape="cube">Куб</button>
        <button class="btn-shape" data-shape="box">Паралелепіпед</button>
        <button class="btn-shape" data-shape="cylinder">Циліндр</button>
        <button class="btn-shape" data-shape="cone">Конус</button>
        <button class="btn-shape" data-shape="pyramid">Піраміда</button>
    </div>

    <div class="views-container">
        <!-- 3D Вигляд -->
        <div class="panel-box">
            <div class="panel-tag">3D Фігура (крути мишкою)</div>
            <div id="canvas3dContainer" class="canvas-3d"></div>
        </div>

        <!-- 2D Розгортка на площині -->
        <div class="panel-box">
            <div class="panel-tag">Креслення для вирізання</div>
            <canvas id="canvas2d" class="canvas-2d" width="400" height="400"></canvas>
        </div>
    </div>

    <div class="info-panel">
        <div class="info-title" id="infoTitle">Куб</div>
        <div class="info-desc" id="infoDesc">Складається з 6 однакових квадратних граней. Пунктир показує лінії згину, а суцільні лінії — контур для вирізання.</div>
    </div>
</div>

<script>
    const shapeData = {
        cube: {
            title: "Куб",
            desc: "Складається з 6 однакових квадратних граней. Суцільні лінії — контур вирізання, пунктирні — лінії згину на папері."
        },
        box: {
            title: "Прямокутний паралелепіпед",
            desc: "Складається з 6 прямокутних граней, попарно рівних між собою."
        },
        cylinder: {
            title: "Циліндр",
            desc: "Розгортка складається з 2 однакових кругів (основ) та прямокутника бічної поверхні довжиною 2πR."
        },
        cone: {
            title: "Конус",
            desc: "Розгортка містить круг основи та круговий сектор бічної поверхні (твірна є радіусом сектора)."
        },
        pyramid: {
            title: "Чотирикутна піраміда",
            desc: "Складається з квадрата в основі та 4 однакових рівнобедрених трикутників."
        }
    };

    let currentShape = 'cube';

    // --- 1. Three.js Сцена (3D Фігура) ---
    const container3d = document.getElementById('canvas3dContainer');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(0, 2.5, 4.5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(400, 400);
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    container3d.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const light = new THREE.DirectionalLight(0xffffff, 0.8);
    light.position.set(5, 10, 7);
    scene.add(light);

    const meshGroup = new THREE.Group();
    scene.add(meshGroup);

    const colors = [0x38BDF8, 0xC084FC, 0xFACC15, 0xF43F5E, 0x4ADE80, 0x60A5FA];

    function createSolid3D(shape) {
        while (meshGroup.children.length > 0) {
            meshGroup.remove(meshGroup.children[0]);
        }

        let geom;
        if (shape === 'cube') {
            geom = new THREE.BoxGeometry(1.6, 1.6, 1.6);
        } else if (shape === 'box') {
            geom = new THREE.BoxGeometry(2.0, 1.1, 1.3);
        } else if (shape === 'cylinder') {
            geom = new THREE.CylinderGeometry(0.85, 0.85, 1.8, 32);
        } else if (shape === 'cone') {
            geom = new THREE.ConeGeometry(0.95, 1.8, 32);
        } else if (shape === 'pyramid') {
            geom = new THREE.ConeGeometry(1.2, 1.6, 4);
            geom.rotateY(Math.PI / 4);
        }

        const mat = new THREE.MeshStandardMaterial({
            color: 0x38BDF8,
            roughness: 0.3,
            metalness: 0.15,
            transparent: true,
            opacity: 0.85
        });

        const mesh = new THREE.Mesh(geom, mat);
        const edges = new THREE.EdgesGeometry(geom);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xFFFFFF, linewidth: 2 }));
        mesh.add(line);
        meshGroup.add(mesh);
    }

    // Обертання 3D мишкою
    let isDragging = false;
    let prevMouse = { x: 0, y: 0 };

    container3d.addEventListener('pointerdown', (e) => {
        isDragging = true;
        prevMouse = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - prevMouse.x;
        const dy = e.clientY - prevMouse.y;
        meshGroup.rotation.y += dx * 0.01;
        meshGroup.rotation.x += dy * 0.01;
        prevMouse = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointerup', () => { isDragging = false; });

    // --- 2. Canvas 2D (Плоска розгортка на папері) ---
    const canvas2d = document.getElementById('canvas2d');
    const ctx = canvas2d.getContext('2d');

    function drawGridPaper() {
        ctx.clearRect(0, 0, canvas2d.width, canvas2d.height);
        
        // Фонова міліметрова сітка для відчуття паперу
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.08)';
        ctx.lineWidth = 1;
        const step = 20;
        for (let x = 0; x < canvas2d.width; x += step) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas2d.height);
            ctx.stroke();
        }
        for (let y = 0; y < canvas2d.height; y += step) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas2d.width, y);
            ctx.stroke();
        }
    }

    function drawFace(x, y, w, h, fillCol, isDashed = false) {
        ctx.save();
        ctx.fillStyle = fillCol;
        ctx.fillRect(x, y, w, h);
        
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 2;
        if (isDashed) ctx.setLineDash([4, 4]);
        ctx.strokeRect(x, y, w, h);
        ctx.restore();
    }

    function drawFlatNet(shape) {
        drawGridPaper();
        const cx = canvas2d.width / 2;
        const cy = canvas2d.height / 2;

        if (shape === 'cube') {
            const s = 60;
            // Класичний хрест із 6 квадратів
            // Ряд із 4 квадратів
            drawFace(cx - 2*s, cy - s/2, s, s, 'rgba(56, 189, 248, 0.4)');
            drawFace(cx - s, cy - s/2, s, s, 'rgba(192, 132, 252, 0.4)');
            drawFace(cx, cy - s/2, s, s, 'rgba(250, 204, 21, 0.4)');
            drawFace(cx + s, cy - s/2, s, s, 'rgba(244, 63, 94, 0.4)');
            // Верхній і нижній квадрати
            drawFace(cx - s, cy - 1.5*s, s, s, 'rgba(74, 222, 128, 0.4)');
            drawFace(cx - s, cy + 0.5*s, s, s, 'rgba(96, 165, 250, 0.4)');

        } else if (shape === 'box') {
            const w = 80, h = 45, d = 55;
            // Розгортка паралелепіпеда
            drawFace(cx - w/2, cy - h/2, w, h, 'rgba(56, 189, 248, 0.4)'); // Центр
            drawFace(cx - w/2 - d, cy - h/2, d, h, 'rgba(192, 132, 252, 0.4)'); // Ліво
            drawFace(cx + w/2, cy - h/2, d, h, 'rgba(192, 132, 252, 0.4)'); // Право
            drawFace(cx - w/2, cy - h/2 - d, w, d, 'rgba(250, 204, 21, 0.4)'); // Верх
            drawFace(cx - w/2, cy + h/2, w, d, 'rgba(250, 204, 21, 0.4)'); // Низ
            drawFace(cx - w/2, cy + h/2 + d, w, h, 'rgba(56, 189, 248, 0.4)'); // Задня грань

        } else if (shape === 'cylinder') {
            const r = 35;
            const w = 2 * Math.PI * r;
            const h = 100;

            // Прямокутник
            drawFace(cx - w/2, cy - h/2, w, h, 'rgba(56, 189, 248, 0.4)');

            // Верхня основа
            ctx.save();
            ctx.fillStyle = 'rgba(250, 204, 21, 0.4)';
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy - h/2 - r - 2, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Нижня основа
            ctx.beginPath();
            ctx.arc(cx, cy + h/2 + r + 2, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();

        } else if (shape === 'cone') {
            const r = 35;
            const L = 110; // Радіус сектора
            const theta = (r / L) * 2 * Math.PI;

            ctx.save();
            // Круговий сектор
            ctx.fillStyle = 'rgba(192, 132, 252, 0.4)';
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy - 20);
            ctx.arc(cx, cy - 20, L, Math.PI/2 - theta/2, Math.PI/2 + theta/2);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Круг основи
            ctx.fillStyle = 'rgba(250, 204, 21, 0.4)';
            ctx.beginPath();
            ctx.arc(cx, cy + L - 10, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();

        } else if (shape === 'pyramid') {
            const s = 80;
            const triH = 95;

            // Квадрат в центрі
            drawFace(cx - s/2, cy - s/2, s, s, 'rgba(56, 189, 248, 0.4)');

            // 4 бічні трикутники
            ctx.save();
            ctx.fillStyle = 'rgba(244, 63, 94, 0.4)';
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 2;

            const drawTri = (x1, y1, x2, y2, topX, topY) => {
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.lineTo(topX, topY);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            };

            // Верхній
            drawTri(cx - s/2, cy - s/2, cx + s/2, cy - s/2, cx, cy - s/2 - triH);
            // Нижній
            drawTri(cx - s/2, cy + s/2, cx + s/2, cy + s/2, cx, cy + s/2 + triH);
            // Лівий
            drawTri(cx - s/2, cy - s/2, cx - s/2, cy + s/2, cx - s/2 - triH, cy);
            // Правий
            drawTri(cx + s/2, cy - s/2, cx + s/2, cy + s/2, cx + s/2 + triH, cy);

            ctx.restore();
        }
    }

    // --- 3. Меню та перемикання ---
    const buttons = document.querySelectorAll('.btn-shape');
    buttons.forEach(btn => {
        btn.addEventListener('click', (e) => {
            buttons.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            currentShape = e.target.getAttribute('data-shape');
            document.getElementById('infoTitle').textContent = shapeData[currentShape].title;
            document.getElementById('infoDesc').textContent = shapeData[currentShape].desc;

            meshGroup.rotation.set(0.3, -0.4, 0);
            createSolid3D(currentShape);
            drawFlatNet(currentShape);
        });
    });

    // Анімаційний цикл
    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }

    // Початковий старт
    meshGroup.rotation.set(0.3, -0.4, 0);
    createSolid3D('cube');
    drawFlatNet('cube');
    animate();
</script>

</body>
</html>
