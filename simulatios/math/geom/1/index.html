<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Об'ємні тіла та їх розгортки</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #EFEEEC;
            color: #333333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #FFFFFF;
            width: 100%;
            max-width: 900px;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            color: #2C3E50;
        }

        /* Меню вибору тіл */
        .menu {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-shape {
            background-color: #E2E0DC;
            border: none;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            color: #4A4A4A;
            transition: all 0.2s;
        }

        .btn-shape:hover {
            background-color: #D1CFCA;
        }

        .btn-shape.active {
            background-color: #6B7A58;
            color: #FFFFFF;
        }

        /* Область 3D-сцени */
        .canvas-container {
            width: 100%;
            height: 400px;
            background: #F8F7F5;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            border: 1px solid #E5E3DF;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Панель розгортання */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            font-weight: bold;
            color: #555555;
        }

        input[type=range] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #E2E0DC;
            outline: none;
            accent-color: #6B7A58;
            cursor: pointer;
        }

        /* Інформаційний блок */
        .info-box {
            background: #F8F7F5;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 4px solid #6B7A58;
            font-size: 14px;
            line-height: 1.4;
        }

        .info-title {
            font-weight: bold;
            color: #2C3E50;
            margin-bottom: 2px;
        }
    </style>

    <!-- Підключення Three.js через CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div class="container">
    <h1>Об'ємні геометричні тіла та їх розгортки</h1>

    <div class="menu" id="shapeMenu">
        <button class="btn-shape active" data-shape="cube">Куб</button>
        <button class="btn-shape" data-shape="box">Паралелепіпед</button>
        <button class="btn-shape" data-shape="cylinder">Циліндр</button>
        <button class="btn-shape" data-shape="cone">Конус</button>
        <button class="btn-shape" data-shape="pyramid">Піраміда</button>
    </div>

    <div class="canvas-container" id="canvasContainer"></div>

    <div class="controls">
        <div class="slider-label">
            <span>Складено (0%)</span>
            <span>Ступінь розгортки</span>
            <span>Розгорнуто (100%)</span>
        </div>
        <input type="range" id="unfoldSlider" min="0" max="100" value="0">
    </div>

    <div class="info-box" id="infoBox">
        <div class="info-title" id="infoTitle">Куб</div>
        <div id="infoDesc">Складається з 6 однакових квадратних граней. У розгортці утворюють форму хреста.</div>
    </div>
</div>

<script>
    // Опис тіл та їх інформації
    const shapeData = {
        cube: { title: "Куб", desc: "Складається з 6 однакових квадратних граней." },
        box: { title: "Прямокутний паралелепіпед", desc: "Складається з 6 прямокутних граней, попарно рівних між собою." },
        cylinder: { title: "Циліндр", desc: "Складається з двох рівних кругів (основ) та прямокутника бічної поверхні." },
        cone: { title: "Конус", desc: "Складається з одного круга (основи) та кругового сектора (бічної поверхні)." },
        pyramid: { title: "Чотирикутна піраміда", desc: "Складається з квадрата в основі та 4 трикутних бічних граней." }
    };

    const container = document.getElementById('canvasContainer');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 4, 7);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setClearColor(0xF8F7F5);
    container.appendChild(renderer.domElement);

    // Освітлення
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // Обертання мишею
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let groupRotation = new THREE.Group();
    scene.add(groupRotation);

    container.addEventListener('mousedown', (e) => { isDragging = true; previousMousePosition = { x: e.clientX, y: e.clientY }; });
    container.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        let deltaX = e.clientX - previousMousePosition.x;
        let deltaY = e.clientY - previousMousePosition.y;
        groupRotation.rotation.y += deltaX * 0.008;
        groupRotation.rotation.x += deltaY * 0.008;
        previousMousePosition = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('mouseup', () => { isDragging = false; });

    // Оливкові кольори для граней
    const oliveColors = [0x78866B, 0x6B7A58, 0x8A9A7B, 0x5E6C4D, 0x9CB08B, 0x556344];

    let currentShape = 'cube';
    let parts = []; // Масив об'єктів { mesh, closedPos, closedRot, openPos, openRot }

    function createFace(geometry, colorIndex, matType = 'standard') {
        const material = new THREE.MeshStandardMaterial({
            color: oliveColors[colorIndex % oliveColors.length],
            roughness: 0.4,
            metalness: 0.1,
            side: THREE.DoubleSide
        });
        return new THREE.Mesh(geometry, material);
    }

    function buildShape(shape) {
        // Очищення попередніх елементів
        while(groupRotation.children.length > 0){ 
            groupRotation.remove(groupRotation.children[0]); 
        }
        parts = [];

        if (shape === 'cube') {
            const size = 1.2;
            const h = size / 2;
            // 6 граней куба: Bottom, Top, Front, Back, Left, Right
            const configs = [
                { pOpen: [0, -h, 0], rOpen: [-Math.PI/2, 0, 0], pClose: [0, -h, 0], rClose: [0, 0, 0] }, // дно
                { pOpen: [0, -h, size*2], rOpen: [Math.PI/2, 0, 0], pClose: [0, h, 0], rClose: [0, 0, 0] }, // верх (відкидається вперед)
                { pOpen: [0, -h, h], rOpen: [0, 0, 0], pClose: [0, 0, h], rClose: [0, 0, 0] }, // перед
                { pOpen: [0, -h, -h], rOpen: [Math.PI, 0, 0], pClose: [0, 0, -h], rClose: [0, Math.PI, 0] }, // зад
                { pOpen: [-h, -h, 0], rOpen: [0, 0, Math.PI/2], pClose: [-h, 0, 0], rClose: [0, -Math.PI/2, 0] }, // ліво
                { pOpen: [h, -h, 0], rOpen: [0, 0, -Math.PI/2], pClose: [h, 0, 0], rClose: [0, Math.PI/2, 0] }  // право
            ];

            const geom = new THREE.PlaneGeometry(size, size);
            configs.forEach((cfg, idx) => {
                const mesh = createFace(geom, idx);
                groupRotation.add(mesh);
                parts.push({
                    mesh,
                    cPos: new THREE.Vector3(...cfg.pClose),
                    cRot: new THREE.Euler(...cfg.rClose),
                    oPos: new THREE.Vector3(...cfg.pOpen),
                    oRot: new THREE.Euler(...cfg.rOpen)
                });
            });

        } else if (shape === 'box') {
            const w = 1.6, h = 1.0, d = 1.0;
            const hw = w/2, hh = h/2, hd = d/2;
            const configs = [
                { pOpen: [0, -hh, 0], rOpen: [-Math.PI/2, 0, 0], pClose: [0, -hh, 0], rClose: [0, 0, 0] }, // дно
                { pOpen: [0, -hh, d*2], rOpen: [Math.PI/2, 0, 0], pClose: [0, hh, 0], rClose: [0, 0, 0] }, // верх
                { pOpen: [0, -hh, hd], rOpen: [0, 0, 0], pClose: [0, 0, hd], rClose: [0, 0, 0] }, // перед (w x h)
                { pOpen: [0, -hh, -hd], rOpen: [Math.PI, 0, 0], pClose: [0, 0, -hd], rClose: [0, Math.PI, 0] }, // зад
                { pOpen: [-hw, -hh, 0], rOpen: [0, 0, Math.PI/2], pClose: [-hw, 0, 0], rClose: [0, -Math.PI/2, 0] }, // ліво (d x h)
                { pOpen: [hw, -hh, 0], rOpen: [0, 0, -Math.PI/2], pClose: [hw, 0, 0], rClose: [0, Math.PI/2, 0] }  // право
            ];

            // Створюємо геометрії відповідних розмірів
            const geomBottomTop = new THREE.PlaneGeometry(w, d);
            const geomFrontBack = new THREE.PlaneGeometry(w, h);
            const geomSides = new THREE.PlaneGeometry(d, h);

            const geoms = [geomBottomTop, geomBottomTop, geomFrontBack, geomFrontBack, geomSides, geomSides];

            configs.forEach((cfg, idx) => {
                const mesh = createFace(geoms[idx], idx);
                groupRotation.add(mesh);
                parts.push({
                    mesh,
                    cPos: new THREE.Vector3(...cfg.pClose),
                    cRot: new THREE.Euler(...cfg.rClose),
                    oPos: new THREE.Vector3(...cfg.pOpen),
                    oRot: new THREE.Euler(...cfg.rOpen)
                });
            });

        } else if (shape === 'cylinder') {
            const r = 0.8, h = 2.0;
            const hh = h/2;
            // Нижня основа, Верхня основа, Бічна поверхня (прямокутник)
            const sideWidth = 2 * Math.PI * r;
            
            const geomBottom = new THREE.CircleGeometry(r, 32);
            const geomTop = new THREE.CircleGeometry(r, 32);
            const geomSide = new THREE.PlaneGeometry(sideWidth, h);

            const configs = [
                { geom: geomBottom, pClose: [0, -hh, 0], rClose: [-Math.PI/2, 0, 0], pOpen: [-sideWidth/2 - r - 0.2, -hh, 0], rOpen: [-Math.PI/2, 0, 0] },
                { geom: geomTop,    pClose: [0, hh, 0],  rClose: [Math.PI/2, 0, 0],  pOpen: [sideWidth/2 + r + 0.2, -hh, 0],  rOpen: [-Math.PI/2, 0, 0] },
                { geom: geomSide,   pClose: [0, 0, 0],   rClose: [0, 0, 0],          pOpen: [0, -hh, 0],                      rOpen: [-Math.PI/2, 0, 0] }
            ];

            configs.forEach((cfg, idx) => {
                const mesh = createFace(cfg.geom, idx);
                groupRotation.add(mesh);
                parts.push({
                    mesh,
                    cPos: new THREE.Vector3(...cfg.pClose),
                    cRot: new THREE.Euler(...cfg.rClose),
                    oPos: new THREE.Vector3(...cfg.pOpen),
                    oRot: new THREE.Euler(...cfg.rOpen)
                });
            });

        } else if (shape === 'cone') {
            const r = 1.0, h = 2.2;
            const geomBase = new THREE.CircleGeometry(r, 32);
            const sideLen = Math.sqrt(r*r + h*h);
            const sectorAngle = 2 * Math.PI * (r / sideLen);
            const geomSector = new THREE.ConeGeometry(r, h, 32); // Використаємо циліндричну розгортку через площину сектора

            // Спрощена розгортка конуса: основа і сектор
            const geomSec = new THREE.RingGeometry(0, sideLen, 32, 1, 0, sectorAngle);

            const configs = [
                { geom: geomBase, pClose: [0, -h/2, 0], rClose: [-Math.PI/2, 0, 0], pOpen: [-r - 0.5, -h/2, 0], rOpen: [-Math.PI/2, 0, 0] },
                { geom: geomSec,  pClose: [0, 0, 0],    rClose: [0, 0, 0],          pOpen: [r + 0.5, -h/2, 0],   rOpen: [-Math.PI/2, 0, 0] }
            ];

            configs.forEach((cfg, idx) => {
                const mesh = createFace(cfg.geom, idx);
                groupRotation.add(mesh);
                parts.push({
                    mesh,
                    cPos: new THREE.Vector3(...cfg.pClose),
                    cRot: new THREE.Euler(...cfg.rClose),
                    oPos: new THREE.Vector3(...cfg.pOpen),
                    oRot: new THREE.Euler(...cfg.rOpen)
                });
            });

        } else if (shape === 'pyramid') {
            const baseSize = 1.6;
            const h = 1.8;
            const hb = baseSize / 2;
            
            const geomBase = new THREE.PlaneGeometry(baseSize, baseSize);
            const triHeight = Math.sqrt(h*h + hb*hb);
            const geomTri = new THREE.ConeGeometry ? new THREE.BufferGeometry() : null; // Зробимо трикутники через shape

            // База + 4 трикутники
            const shapeTri = new THREE.Shape();
            shapeTri.moveTo(-hb, 0);
            shapeTri.lineTo(hb, 0);
            shapeTri.lineTo(0, triHeight);
            shapeTri.closePath();
            const geomSideTri = new THREE.ShapeGeometry(shapeTri);

            const configs = [
                { geom: geomBase, pClose: [0, -h/3, 0], rClose: [-Math.PI/2, 0, 0], pOpen: [0, -h/3, 0], rOpen: [-Math.PI/2, 0, 0] }, // основа
                { geom: geomSideTri, pClose: [0, 0, hb], rClose: [0, 0, 0], pOpen: [0, -h/3, hb + triHeight/2], rOpen: [-Math.PI/6, 0, 0] }, // перед
                { geom: geomSideTri, pClose: [0, 0, -hb], rClose: [Math.PI, 0, 0], pOpen: [0, -h/3, -hb - triHeight/2], rOpen: [-Math.PI/6, Math.PI, 0] }, // зад
                { geom: geomSideTri, pClose: [-hb, 0, 0], rClose: [0, Math.PI/2, 0], pOpen: [-hb - triHeight/2, -h/3, 0], rOpen: [-Math.PI/6, Math.PI/2, 0] }, // ліво
                { geom: geomSideTri, pClose: [hb, 0, 0], rClose: [0, -Math.PI/2, 0], pOpen: [hb + triHeight/2, -h/3, 0], rOpen: [-Math.PI/6, -Math.PI/2, 0] }  // право
            ];

            configs.forEach((cfg, idx) => {
                const mesh = createFace(cfg.geom, idx);
                groupRotation.add(mesh);
                parts.push({
                    mesh,
                    cPos: new THREE.Vector3(...cfg.pClose),
                    cRot: new THREE.Euler(...cfg.rClose),
                    oPos: new THREE.Vector3(...cfg.pOpen),
                    oRot: new THREE.Euler(...cfg.rOpen)
                });
            });
        }
        updateUnfold(0);
    }

    // Інтерполяція положення і повороту при розгортанні
    function updateUnfold(progress) {
        const t = progress / 100;
        parts.forEach(p => {
            p.mesh.position.lerpVectors(p.cPos, p.oPos, t);
            p.mesh.rotation.x = THREE.MathUtils.lerp(p.cRot.x, p.oRot.x, t);
            p.mesh.rotation.y = THREE.MathUtils.lerp(p.cRot.y, p.oRot.y, t);
            p.mesh.rotation.z = THREE.MathUtils.lerp(p.cRot.z, p.oRot.z, t);
        });
    }

    // Обробники подій меню
    const menuButtons = document.querySelectorAll('.btn-shape');
    menuButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
            menuButtons.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentShape = e.target.getAttribute('data-shape');
            
            // Оновлення тексту опису
            document.getElementById('infoTitle').textContent = shapeData[currentShape].title;
            document.getElementById('infoDesc').textContent = shapeData[currentShape].desc;

            // Скидання повзунка
            document.getElementById('unfoldSlider').value = 0;
            groupRotation.rotation.set(0, 0, 0);
            buildShape(currentShape);
        });
    });

    const slider = document.getElementById('unfoldSlider');
    slider.addEventListener('input', (e) => {
        updateUnfold(parseFloat(e.target.value));
    });

    // Анімація рендерингу
    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }

    // Ініціалізація
    buildShape('cube');
    animate();

    // Ресайз вікна
    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
</script>

</body>
</html>
