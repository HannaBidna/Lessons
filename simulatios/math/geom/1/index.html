<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Розгортки геометричних тіл</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', 'Segoe UI', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0e1c36 0%, #060b14 100%);
            color: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .simulation-card {
            background: #0a1324;
            width: 100%;
            max-width: 680px;
            padding: 20px 24px;
            border-radius: 18px;
            border: 1.5px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(14, 165, 233, 0.12);
        }

        h1 {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: 0.3px;
            margin-bottom: 12px;
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.2);
        }

        /* Меню вибору тіла */
        .shape-nav {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .btn-shape {
            background: #08152e;
            color: #94A3B8;
            border: 1px solid #1E293B;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-shape:hover {
            border-color: #38BDF8;
            color: #F8FAFC;
        }

        .btn-shape.active {
            background: #1e293b;
            color: #38BDF8;
            border-color: #38BDF8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        /* 3D Сцена */
        .canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            margin: 0 auto 14px auto;
            background: #030712;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            touch-action: none;
            cursor: grab;
        }

        .canvas-wrapper:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Повзунок */
        .controls-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 700;
            color: #C084FC;
            text-shadow: 0 0 8px rgba(192, 132, 252, 0.5);
        }

        .slider-val-box {
            font-size: 15px;
            font-weight: 800;
            color: #F8FAFC;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #111e3b;
            border-radius: 3px;
            outline: none;
            border: 1px solid #1E293B;
        }

        input#unfoldSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: radial-gradient(circle, #FFF 30%, #C084FC 80%);
            cursor: pointer;
            box-shadow: 0 0 8px #C084FC;
            border: 2px solid #FFF;
        }

        /* Інфо-панель */
        .info-panel {
            background: #08152e;
            border-left: 3px solid #38BDF8;
            padding: 10px 14px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 12px;
            line-height: 1.4;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .info-title {
            font-weight: 800;
            color: #38BDF8;
            margin-bottom: 2px;
        }

        .info-desc {
            color: #CBD5E1;
        }

        .btn-reset {
            background: linear-gradient(180deg, #FFFFFF 0%, #E2E8F0 60%, #CBD5E1 100%);
            color: #0F172A;
            border: none;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 800;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
            transition: filter 0.2s, transform 0.1s;
        }

        .btn-reset:hover {
            filter: brightness(1.08);
        }

        .btn-reset:active {
            transform: scale(0.97);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div class="simulation-card">
    <h1>3D Розгортки геометричних тіл</h1>

    <div class="shape-nav" id="shapeNav">
        <button class="btn-shape active" data-shape="cube">Куб</button>
        <button class="btn-shape" data-shape="box">Паралелепіпед</button>
        <button class="btn-shape" data-shape="cylinder">Циліндр</button>
        <button class="btn-shape" data-shape="cone">Конус</button>
        <button class="btn-shape" data-shape="pyramid">Піраміда</button>
    </div>

    <div class="canvas-wrapper" id="canvasWrapper"></div>

    <div class="controls-grid">
        <div class="slider-header">
            <span>Ступінь розгортки</span>
            <span class="slider-val-box" id="sliderVal">0%</span>
        </div>
        <input type="range" id="unfoldSlider" min="0" max="100" value="0">
    </div>

    <div class="info-panel">
        <div class="info-title" id="infoTitle">Куб</div>
        <div class="info-desc" id="infoDesc">Складається з 6 однакових квадратних граней. У розгортці вони лягають на площину у формі хреста.</div>
    </div>
</div>

<script>
    const shapeData = {
        cube: { title: "Куб", desc: "Складається з 6 однакових квадратних граней. У розгортці вони лягають на площину у формі хреста." },
        box: { title: "Прямокутний паралелепіпед", desc: "Складається з 6 прямокутних граней, які попарно рівні між собою." },
        cylinder: { title: "Циліндр", desc: "Розгортка містить 2 рівні круги (основи) та прямокутник бічної поверхні довжиною 2πR." },
        cone: { title: "Конус", desc: "Розгортка складається з 1 круга (основи) та кругового сектора бічної поверхні." },
        pyramid: { title: "Чотирикутна піраміда", desc: "Складається з 1 квадрата в основі та 4 рівних трикутних бічних граней." }
    };

    const container = document.getElementById('canvasWrapper');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 1000);
    camera.position.set(0, 7, 7.5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(500, 500);
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    container.appendChild(renderer.domElement);

    // Світло
    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(5, 12, 8);
    scene.add(dirLight);

    // Допоміжна сітка площини
    const grid = new THREE.GridHelper(10, 10, 0x38BDF8, 0x1E293B);
    grid.position.y = 0;
    scene.add(grid);

    const mainGroup = new THREE.Group();
    scene.add(mainGroup);

    // Палітра неонових акцентів
    const colors = [0x38BDF8, 0xC084FC, 0xFACC15, 0xF43F5E, 0x4ADE80, 0x60A5FA];

    let parts = [];
    let currentShape = 'cube';

    function createMesh(geom, colorIdx) {
        const mat = new THREE.MeshStandardMaterial({
            color: colors[colorIdx % colors.length],
            roughness: 0.35,
            metalness: 0.15,
            side: THREE.DoubleSide
        });
        const mesh = new THREE.Mesh(geom, mat);
        // Додаємо контур ребер для чіткості
        const edges = new THREE.EdgesGeometry(geom);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.6 }));
        mesh.add(line);
        return mesh;
    }

    function buildShape(shape) {
        while (mainGroup.children.length > 0) {
            mainGroup.remove(mainGroup.children[0]);
        }
        parts = [];

        if (shape === 'cube') {
            const s = 1.0;
            const geom = new THREE.PlaneGeometry(s, s);

            // Нижній квадрат лежить на Y=0
            const configs = [
                { geom, p0: [0, 0, 0], r0: [-Math.PI/2, 0, 0], p1: [0, 0, 0], r1: [-Math.PI/2, 0, 0] }, // Дно
                { geom, p0: [0, s/2, s/2], r0: [0, 0, 0], p1: [0, 0, s], r1: [-Math.PI/2, 0, 0] }, // Перед
                { geom, p0: [0, s/2, -s/2], r0: [Math.PI, 0, 0], p1: [0, 0, -s], r1: [-Math.PI/2, 0, 0] }, // Зад
                { geom, p0: [-s/2, s/2, 0], r0: [0, -Math.PI/2, 0], p1: [-s, 0, 0], r1: [-Math.PI/2, 0, 0] }, // Ліво
                { geom, p0: [s/2, s/2, 0], r0: [0, Math.PI/2, 0], p1: [s, 0, 0], r1: [-Math.PI/2, 0, 0] }, // Право
                { geom, p0: [0, s, 0], r0: [Math.PI/2, 0, 0], p1: [0, 0, 2*s], r1: [-Math.PI/2, 0, 0] } // Верх
            ];

            configs.forEach((c, idx) => {
                const mesh = createMesh(c.geom, idx);
                mainGroup.add(mesh);
                parts.push({ mesh, p0: new THREE.Vector3(...c.p0), r0: new THREE.Euler(...c.r0), p1: new THREE.Vector3(...c.p1), r1: new THREE.Euler(...c.r1) });
            });

        } else if (shape === 'box') {
            const w = 1.6, h = 0.9, d = 1.0;
            const geomBot = new THREE.PlaneGeometry(w, d);
            const geomFB = new THREE.PlaneGeometry(w, h);
            const geomLR = new THREE.PlaneGeometry(d, h);

            const configs = [
                { geom: geomBot, p0: [0, 0, 0], r0: [-Math.PI/2, 0, 0], p1: [0, 0, 0], r1: [-Math.PI/2, 0, 0] }, // Дно
                { geom: geomFB,  p0: [0, h/2, d/2], r0: [0, 0, 0], p1: [0, 0, d/2 + h/2], r1: [-Math.PI/2, 0, 0] }, // Перед
                { geom: geomFB,  p0: [0, h/2, -d/2], r0: [Math.PI, 0, 0], p1: [0, 0, -d/2 - h/2], r1: [-Math.PI/2, 0, 0] }, // Зад
                { geom: geomLR,  p0: [-w/2, h/2, 0], r0: [0, -Math.PI/2, 0], p1: [-w/2 - d/2, 0, 0], r1: [-Math.PI/2, 0, -Math.PI/2] }, // Ліво
                { geom: geomLR,  p0: [w/2, h/2, 0], r0: [0, Math.PI/2, 0], p1: [w/2 + d/2, 0, 0], r1: [-Math.PI/2, 0, Math.PI/2] }, // Право
                { geom: geomBot, p0: [0, h, 0], r0: [Math.PI/2, 0, 0], p1: [0, 0, d + h], r1: [-Math.PI/2, 0, 0] } // Верх
            ];

            configs.forEach((c, idx) => {
                const mesh = createMesh(c.geom, idx);
                mainGroup.add(mesh);
                parts.push({ mesh, p0: new THREE.Vector3(...c.p0), r0: new THREE.Euler(...c.r0), p1: new THREE.Vector3(...c.p1), r1: new THREE.Euler(...c.r1) });
            });

        } else if (shape === 'cylinder') {
            const r = 0.7, h = 1.6;
            const w = 2 * Math.PI * r;
            const geomBase = new THREE.CircleGeometry(r, 32);
            const geomSide = new THREE.PlaneGeometry(w, h);

            const configs = [
                { geom: geomSide, p0: [0, h/2, 0], r0: [0, 0, 0], p1: [0, 0, 0], r1: [-Math.PI/2, 0, 0] }, // Розгорнутий прямокутник
                { geom: geomBase, p0: [0, 0, 0], r0: [-Math.PI/2, 0, 0], p1: [0, 0, -h/2 - r], r1: [-Math.PI/2, 0, 0] }, // Нижня основа
                { geom: geomBase, p0: [0, h, 0], r0: [Math.PI/2, 0, 0], p1: [0, 0, h/2 + r], r1: [-Math.PI/2, 0, 0] }   // Верхня основа
            ];

            configs.forEach((c, idx) => {
                const mesh = createMesh(c.geom, idx);
                mainGroup.add(mesh);
                parts.push({ mesh, p0: new THREE.Vector3(...c.p0), r0: new THREE.Euler(...c.r0), p1: new THREE.Vector3(...c.p1), r1: new THREE.Euler(...c.r1) });
            });

        } else if (shape === 'cone') {
            const r = 0.8, h = 1.6;
            const L = Math.sqrt(r*r + h*h); // Твірна
            const theta = (r / L) * 2 * Math.PI;

            const geomBase = new THREE.CircleGeometry(r, 32);
            const geomSector = new THREE.RingGeometry(0, L, 32, 1, Math.PI/2 - theta/2, theta);

            const configs = [
                { geom: geomBase,   p0: [0, 0, 0], r0: [-Math.PI/2, 0, 0], p1: [0, 0, -r - 0.2], r1: [-Math.PI/2, 0, 0] },
                { geom: geomSector, p0: [0, h/2, 0], r0: [0, 0, 0], p1: [0, 0, L/2 + 0.2], r1: [-Math.PI/2, 0, 0] }
            ];

            configs.forEach((c, idx) => {
                const mesh = createMesh(c.geom, idx + 2);
                mainGroup.add(mesh);
                parts.push({ mesh, p0: new THREE.Vector3(...c.p0), r0: new THREE.Euler(...c.r0), p1: new THREE.Vector3(...c.p1), r1: new THREE.Euler(...c.r1) });
            });

        } else if (shape === 'pyramid') {
            const s = 1.2;
            const h = 1.4;
            const slantH = Math.sqrt(h*h + (s/2)*(s/2));

            const geomBase = new THREE.PlaneGeometry(s, s);

            // Створення трикутної грані
            const triShape = new THREE.Shape();
            triShape.moveTo(-s/2, 0);
            triShape.lineTo(s/2, 0);
            triShape.lineTo(0, slantH);
            triShape.closePath();
            const geomTri = new THREE.ShapeGeometry(triShape);

            const alpha = Math.atan2(h, s/2); // Кут нахилу піраміди

            const configs = [
                { geom: geomBase, p0: [0, 0, 0], r0: [-Math.PI/2, 0, 0], p1: [0, 0, 0], r1: [-Math.PI/2, 0, 0] }, // Основа
                { geom: geomTri,  p0: [0, 0, s/2], r0: [Math.PI/2 - alpha, 0, 0], p1: [0, 0, s/2], r1: [-Math.PI/2, 0, 0] }, // Перед
                { geom: geomTri,  p0: [0, 0, -s/2], r0: [-Math.PI/2 + alpha, Math.PI, 0], p1: [0, 0, -s/2], r1: [Math.PI/2, 0, 0] }, // Зад
                { geom: geomTri,  p0: [-s/2, 0, 0], r0: [0, -Math.PI/2, Math.PI/2 - alpha], p1: [-s/2, 0, 0], r1: [-Math.PI/2, 0, Math.PI/2] }, // Ліво
                { geom: geomTri,  p0: [s/2, 0, 0], r0: [0, Math.PI/2, -Math.PI/2 + alpha], p1: [s/2, 0, 0], r1: [-Math.PI/2, 0, -Math.PI/2] } // Право
            ];

            configs.forEach((c, idx) => {
                const mesh = createMesh(c.geom, idx);
                mainGroup.add(mesh);
                parts.push({ mesh, p0: new THREE.Vector3(...c.p0), r0: new THREE.Euler(...c.r0), p1: new THREE.Vector3(...c.p1), r1: new THREE.Euler(...c.r1) });
            });
        }

        updateUnfold(0);
    }

    function updateUnfold(progress) {
        const t = progress / 100;
        parts.forEach(p => {
            p.mesh.position.lerpVectors(p.p0, p.p1, t);
            p.mesh.rotation.x = THREE.MathUtils.lerp(p.r0.x, p.r1.x, t);
            p.mesh.rotation.y = THREE.MathUtils.lerp(p.r0.y, p.r1.y, t);
            p.mesh.rotation.z = THREE.MathUtils.lerp(p.r0.z, p.r1.z, t);
        });
    }

    // Обертання сцени мишею
    let isDragging = false;
    let prevMouse = { x: 0, y: 0 };

    container.addEventListener('pointerdown', (e) => {
        isDragging = true;
        prevMouse = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - prevMouse.x;
        const dy = e.clientY - prevMouse.y;

        mainGroup.rotation.y += dx * 0.01;
        mainGroup.rotation.x += dy * 0.01;
        grid.rotation.y = mainGroup.rotation.y;

        prevMouse = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointerup', () => { isDragging = false; });

    // Керування кнопками меню
    const buttons = document.querySelectorAll('.btn-shape');
    const slider = document.getElementById('unfoldSlider');
    const sliderVal = document.getElementById('sliderVal');

    buttons.forEach(btn => {
        btn.addEventListener('click', (e) => {
            buttons.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');

            currentShape = e.target.getAttribute('data-shape');
            document.getElementById('infoTitle').textContent = shapeData[currentShape].title;
            document.getElementById('infoDesc').textContent = shapeData[currentShape].desc;

            slider.value = 0;
            sliderVal.textContent = '0%';
            mainGroup.rotation.set(0, 0, 0);
            grid.rotation.set(0, 0, 0);

            buildShape(currentShape);
        });
    });

    slider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        sliderVal.textContent = `${Math.round(val)}%`;
        updateUnfold(val);
    });

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }

    buildShape('cube');
    animate();
</script>

</body>
</html>
