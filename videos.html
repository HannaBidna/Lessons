<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nadia School — Відео</title>
  <style>
    :root {
      --accent: #d8e2dc;
      --card-bg: rgba(43, 47, 39, 0.85);
      --border-color: rgba(255, 255, 255, 0.2);
      --text-main: #f4f6f0;
      --text-sub: #c0c6b7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      background-color: #6b7362;
      background: linear-gradient(rgba(30, 33, 27, 0.45), rgba(30, 33, 27, 0.45)), 
                  url('./bg_videos.jpg') no-repeat center center / cover;
    }

    .container {
      width: 100%;
      max-width: 580px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 25px;
      background: rgba(0, 0, 0, 0.35);
      padding: 8px 16px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
    }
    .back-link:hover {
      background: rgba(0, 0, 0, 0.6);
      color: var(--accent);
    }

    .page-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 6px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .page-desc {
      color: var(--text-sub);
      font-size: 14px;
      margin-bottom: 28px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
    }

    .empty-box {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px dashed var(--border-color);
      border-radius: 16px;
      padding: 50px 20px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }

    .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty-text { font-size: 15px; color: var(--text-sub); }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">&larr; На головну</a>
    <h1 class="page-title">🎬 Відеоуроки</h1>
    <p class="page-desc">Колекція навчальних відеоматеріалів:</p>

    <div class="empty-box">
      <div class="empty-icon">⏳</div>
      <div class="empty-text">Розділ наповнюється. Незабаром тут з'являться перші відеоуроки!</div>
    </div>
  </div>
</body>
</html>
