<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nadia School — Історії</title>
  <style>
    :root {
      --bg-main: #131419;
      --bg-card: #1c1d24;
      --bg-card-hover: #252630;
      --border-color: #2e303d;
      --accent: #00d2ff;
      --accent-glow: rgba(0, 210, 255, 0.25);
      --text-main: #f0f2f5;
      --text-sub: #9ba1b0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .container { width: 100%; max-width: 600px; }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 25px;
      transition: opacity 0.2s;
    }
    .back-link:hover { opacity: 0.8; }
    .page-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #fff;
    }
    .page-desc {
      color: var(--text-sub);
      font-size: 14px;
      margin-bottom: 30px;
    }
    .list { display: flex; flex-direction: column; gap: 14px; }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 18px 20px;
      text-decoration: none;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.25s ease;
    }
    .card:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }
    .card-left { display: flex; align-items: center; gap: 16px; }
    .card-icon {
      font-size: 24px;
      background: rgba(0, 210, 255, 0.08);
      border: 1px solid rgba(0, 210, 255, 0.2);
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .card-title { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 3px; }
    .card-desc { font-size: 13px; color: var(--text-sub); }
    .card-arrow { color: var(--accent); font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">&larr; Назад на головну</a>
    <h1 class="page-title">📖 Історії та сторібуки</h1>
    <p class="page-desc">Оберіть книгу для перегляду:</p>

    <div class="list">
      <!-- Посилання на сторібук (папка archimed) -->
      <a href="archimed/" class="card">
        <div class="card-left">
          <div class="card-icon">👑</div>
          <div>
            <div class="card-title">Архімед і корона</div>
            <div class="card-desc">Ілюстрована історія закону гідростатики</div>
          </div>
        </div>
        <div class="card-arrow">&rarr;</div>
      </a>
    </div>
  </div>

</body>
</html>
