<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nadia School — Історії</title>
  <style>
    :root {
      --accent: #ffd166;
      --card-bg: rgba(61, 27, 17, 0.85);
      --card-hover: rgba(82, 36, 23, 0.95);
      --border-color: rgba(255, 255, 255, 0.2);
      --text-main: #fff5eb;
      --text-sub: #dfc2b6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      background-color: #a4533a;
      background: linear-gradient(rgba(35, 14, 8, 0.85), rgba(35, 14, 8, 0.9)), 
            url('./bg_stories.jpg') no-repeat center center / cover;
    }

    .container {
      width: 100%;
      max-width: 580px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 25px;
      background: rgba(0, 0, 0, 0.35);
      padding: 8px 16px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
    }
    .back-link:hover {
      background: rgba(0, 0, 0, 0.6);
      color: var(--accent);
    }

    .page-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 6px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .page-desc {
      color: var(--text-sub);
      font-size: 14px;
      margin-bottom: 28px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
    }

    .list { display: flex; flex-direction: column; gap: 14px; }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px 22px;
      text-decoration: none;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }
    .card:hover {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(255, 209, 102, 0.25);
    }

    .card-left { display: flex; align-items: center; gap: 16px; }

    .card-icon {
      font-size: 24px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .card-title { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 3px; }
    .card-desc { font-size: 13px; color: var(--text-sub); }
    .card-arrow { color: var(--accent); font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">&larr; На головну</a>
    <h1 class="page-title">📖 Історії та сторібуки</h1>
    <p class="page-desc">Наукові відкриття у форматі захоплюючих історій:</p>

    <div class="list">
      <a href="archimed/" class="card">
        <div class="card-left">
          <div class="card-icon">👑</div>
          <div>
            <div class="card-title">Архімед і корона</div>
            <div class="card-desc">Ілюстрована історія про закон гідростатики</div>
          </div>
        </div>
        <div class="card-arrow">&rarr;</div>
      </a>
    </div>
  </div>
</body>
</html>
