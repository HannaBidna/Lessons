<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nadia School — Фізика</title>
  <style>
    :root {
      --bg-main: #131419;
      --bg-card: #1c1d24;
      --bg-card-hover: #252630;
      --border-color: #2e303d;
      --accent: #00d2ff;
      --accent-orange: #ff9f43;
      --text-main: #f0f2f5;
      --text-sub: #9ba1b0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .container { width: 100%; max-width: 650px; display: flex; flex-direction: column; }
    
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-sub);
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 25px;
      transition: color 0.2s;
    }
    .back-btn:hover { color: var(--accent); }

    .subject-header { text-align: center; margin-bottom: 35px; }
    .subject-icon { font-size: 48px; margin-bottom: 10px; }
    .subject-title { font-size: 32px; font-weight: 700; color: #fff; }
    .subject-desc { font-size: 15px; color: var(--text-sub); margin-top: 5px; }

    .section-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--accent);
      margin: 25px 0 15px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .class-group {
      margin-bottom: 25px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px;
    }

    .class-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--accent-orange);
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .labs-grid { display: flex; flex-direction: column; gap: 10px; }

    .lab-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 18px;
      text-decoration: none;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }
    .lab-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent);
      transform: translateX(4px);
    }

    .lab-name { font-size: 15px; font-weight: 500; }
    .lab-arrow { color: var(--accent); font-weight: bold; }

    .disabled-card {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .disabled-card:hover {
      background: var(--bg-card);
      border-color: var(--border-color);
      transform: none;
    }

    footer { text-align: center; margin-top: 40px; font-size: 13px; color: #606770; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-btn">&larr; Повернутися до предметів</a>

    <header class="subject-header">
      <div class="subject-icon">⚡</div>
      <h1 class="subject-title">Фізика</h1>
      <p class="subject-desc">Лабораторні роботи, симуляції та експерименти</p>
    </header>

    <main>
      <div class="section-title">🧪 Лабораторні роботи</div>

      <!-- 7 КЛАС -->
      <div class="class-group">
        <div class="class-title">7 клас</div>
        <div class="labs-grid">
          
          <a href="lab-length.html" class="lab-card">
            <span class="lab-name"><strong>№1:</strong> Вимірювання довжин тіл за допомогою власних мір</span>
            <span class="lab-arrow">&rarr;</span>
          </a>

          <a href="lab-area.html" class="lab-card">
            <span class="lab-name"><strong>№2:</strong> Вимірювання лінійних розмірів та площі поверхонь</span>
            <span class="lab-arrow">&rarr;</span>
          </a>

        </div>
      </div>

      <!-- 8 КЛАС -->
      <div class="class-group">
        <div class="class-title">8 клас</div>
        <div class="labs-grid">
          
          <div class="lab-card disabled-card">
            <span class="lab-name" style="color: var(--text-sub);">Матеріали у розробці...</span>
          </div>

        </div>
      </div>
    </main>

    <footer>&copy; Nadia School. Всі права захищено.</footer>
  </div>
</body>
</html>
