<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Види трикутників</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#253042; --sand:#DBC3A9; --sand-l:#F4EBE1; --sand-xl:#FAF5EF;
    --terra:#AF5940; --terra-d:#93462F; --grey:#797B6E; --line:#E6D9CA;
    --ok:#2E8B57; --ok-bg:#E3F4E8; --bad:#C8423B; --bad-bg:#FCE6E3; --sel:#FFE8A8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--sand-l);color:var(--navy);font-family:Montserrat,"Gotham Book",Arial,sans-serif;font-size:18px;line-height:1.6}
  button{font:inherit;color:inherit;cursor:pointer}
  .top{background:var(--navy);color:#fff;padding:22px 24px 26px;position:relative;overflow:hidden}
  .top::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--terra);opacity:.9}
  .top::before{content:"";position:absolute;right:130px;bottom:-70px;width:120px;height:120px;border-radius:50%;background:var(--sand);opacity:.85}
  .top>*{position:relative;z-index:1;max-width:1000px;margin-left:auto;margin-right:auto}
  .top .brand{font-size:14px;font-weight:600;letter-spacing:.06em;color:var(--sand)}
  .top h1{margin:4px auto 0;font-size:32px;line-height:1.2;font-weight:700}
  .top p{margin:6px auto 0;color:#E6E6E6;font-size:16px}
  main{max-width:1000px;margin:0 auto;padding:26px 18px 60px}
  .panel{background:#fff;border-radius:20px;padding:22px 24px;box-shadow:0 4px 18px rgba(37,48,66,.08)}
  .panel h2{margin:0 0 4px;font-size:22px;font-weight:700}
  .how{margin:0 0 12px;color:#4A5468;font-size:17px}
  .hint{margin:0 0 16px}
  .hint summary{cursor:pointer;font-weight:600;color:var(--terra);font-size:16px;list-style:none;display:inline-block;padding:4px 14px;border:2px solid var(--sand);border-radius:25px}
  .hint summary::-webkit-details-marker{display:none}
  .hint .box{margin-top:10px;background:var(--sand-xl);border-left:6px solid var(--terra);border-radius:12px;padding:10px 16px;font-size:17px}


  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .tab{border:2px solid transparent;font-size:15px;font-weight:600;padding:7px 18px;border-radius:25px;background:var(--sand-l);color:var(--navy)}
  .tab:hover{border-color:var(--sand)}
  .tab.cur{background:var(--navy);color:#fff}
  .tab.done:not(.cur){background:var(--ok-bg);color:var(--ok)}
  .tab.done::before{content:"✓ "}
  .task{display:none}
  .task.cur{display:block}
  .bank{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:120px;padding:14px;border-radius:16px;background:var(--sand-l);border:2px solid var(--line)}
  .bank.hover{background:#EFE2D3}
  .bank:empty::after{content:"Усі трикутники розкладено 👍";color:var(--grey);font-size:16px;align-self:center}
  .zones{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
  @media (max-width:700px){.zones{grid-template-columns:1fr}}
  .zone{border-radius:18px;border:3px dashed var(--zc);background:var(--zbg);min-height:190px;padding:0 10px 12px;transition:background .12s}
  .zone.hover{border-style:solid;background:var(--zhv)}
  .zone h3{margin:0 -10px 10px;padding:9px 10px;border-radius:14px 14px 0 0;background:var(--zc);color:#fff;text-align:center;font-size:18px;font-weight:700}
  .zone .in{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .z0{--zc:#253042;--zbg:#EEF1F5;--zhv:#DDE3EC}
  .z1{--zc:#AF5940;--zbg:#FBEFEA;--zhv:#F5DCD2}
  .z2{--zc:#797B6E;--zbg:#F1F1EC;--zhv:#E2E3DA}
  .chip{touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px;cursor:grab;box-shadow:0 3px 0 var(--sand);position:relative;line-height:0}
  .chip svg{width:104px;height:104px;display:block}
  @media (max-width:480px){.chip svg{width:84px;height:84px}}
  .chip:hover{border-color:var(--terra)}
  .chip.selected{background:var(--sel);outline:3px solid #E8B93A}
  .chip.placeholder{opacity:.3}
  .chip.ok{border-color:var(--ok);background:var(--ok-bg);box-shadow:none;cursor:default}
  .chip.bad{border-color:var(--bad);background:var(--bad-bg)}
  .chip.ok::after,.chip.bad::after{position:absolute;right:-7px;top:-9px;font-size:13px;line-height:20px;color:#fff;border-radius:50%;width:20px;height:20px;text-align:center}
  .chip.ok::after{content:"✓";background:var(--ok)}
  .chip.bad::after{content:"✗";background:var(--bad)}
  .chip .no{position:absolute;left:6px;top:4px;font-size:12px;line-height:1;font-weight:700;color:var(--grey)}
  .ghost{position:fixed;z-index:1000;pointer-events:none;box-shadow:0 10px 24px rgba(37,48,66,.3);transform:rotate(-3deg);margin:0}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
  .btn{border:2px solid transparent;border-radius:25px;padding:11px 26px;font-size:17px;font-weight:700}
  .btn.main{background:var(--terra);color:#fff}
  .btn.main:hover{background:var(--terra-d)}
  .btn.sec{background:#fff;border-color:var(--navy);color:var(--navy)}
  .btn.sec:hover{background:var(--sand-l)}
  .hidden{display:none !important}
  .count{margin-left:auto;font-size:15px;color:var(--grey);font-weight:600}
  .fb{margin-top:14px;font-weight:700;min-height:1.6em}
  .fb.good{color:var(--ok)} .fb.meh{color:var(--bad)}
  .why{margin-top:14px;background:var(--sand-xl);border-left:6px solid var(--sand);border-radius:12px;padding:12px 16px}
  .why h3{margin:0 0 8px;font-size:18px}
  .why .it{display:flex;gap:12px;align-items:center;margin:8px 0}
  .why .it svg{width:56px;height:56px;flex:0 0 56px;background:#fff;border-radius:10px}
  .score{display:inline-block;font-size:22px;font-weight:700;color:#fff;background:var(--terra);border-radius:25px;padding:3px 18px;margin-right:8px}
  .legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
  .legend span{display:flex;align-items:center;gap:6px;font-size:15px}
  .legend svg{width:44px;height:30px}
</style>
</head>
<body>
<header class="top">
  <div class="brand">nadia.school</div>
  <h1>Види трикутників</h1>
  <p>Визнач вид трикутника за сторонами і за кутами</p>
</header>
<main>
  <section class="panel">
    <div class="tabs" id="tabs"></div>
    <div id="tasks"></div>
  </section>
</main>

<script>
/* =====================================================================
   ДАНІ. Кожен трикутник задано трьома кутами (сума 180°) і поворотом rot.
   Програма сама малює його і ставить позначки.
   marks: "sides" це рівні сторони рисками, "angles" це рівні кути дужками.
   Прямий кут завжди позначено квадратиком. deg: true підписує градусні міри кутів.
   size: від 0.6 до 1, щоб трикутники були різного розміру.
   ===================================================================== */
const TASKS = [
  {
    tab: "1. Позначки сторін",
    marks: "sides",
    title: "Визнач вид трикутника за сторонами",
    how: "Однаковими рисками позначено рівні сторони. Перетягни кожен трикутник у потрібну групу або натисни на трикутник, а потім на групу.",
    hint: `<b>Різносторонній:</b> усі три сторони різні, рівних позначок немає.<br>
      <b>Рівнобедрений:</b> дві сторони рівні, вони позначені однаковими рисками.<br>
      <b>Рівносторонній:</b> усі три сторони рівні.<br>
      Рівносторонній трикутник теж має дві рівні сторони, але в цій вправі клади його в окрему групу «Рівносторонні».<br>
      Не зважай на те, як трикутник повернутий: рівнобедрений може стояти й «догори ногами».`,
    groups: ["Різносторонні","Рівнобедрені","Рівносторонні"],
    classify: t => { const e = eqSides(t.ang); return e===3 ? 2 : e===2 ? 1 : 0; },
    explain: t => { const e = eqSides(t.ang);
      return e===3 ? "Усі три сторони позначені однаковими рисками, тому трикутник рівносторонній."
           : e===2 ? "Дві сторони позначені однаковими рисками, тому трикутник рівнобедрений."
           : "Жодні дві сторони не позначені як рівні, тому трикутник різносторонній."; },
    items: [
      {ang:[50,60,70], rot:10,  size:.9},
      {ang:[30,60,90], rot:0,   size:1},
      {ang:[25,35,120],rot:-15, size:.95},
      {ang:[45,65,70], rot:200, size:.8},
      {ang:[70,70,40], rot:0,   size:.9},
      {ang:[30,30,120],rot:35,  size:1},
      {ang:[45,45,90], rot:135, size:.85},
      {ang:[55,55,70], rot:250, size:.75},
      {ang:[60,60,60], rot:0,   size:.8},
      {ang:[60,60,60], rot:37,  size:.95},
      {ang:[60,60,60], rot:180, size:.65},
      {ang:[80,80,20], rot:100, size:1}
    ]
  },
  {
    tab: "2. Позначки кутів",
    marks: "angles",
    title: "Визнач вид трикутника за рівними кутами",
    how: "Тепер позначено не сторони, а кути: однакові дужки показують рівні кути. За ними визнач, який це трикутник за сторонами.",
    hint: `Рівні сторони трикутника лежать напроти рівних кутів. Тому:<br>
      <b>два кути рівні</b> (дві однакові дужки), отже трикутник <b>рівнобедрений</b>;<br>
      <b>усі три кути рівні</b>, отже трикутник <b>рівносторонній</b> (кожен кут 60°);<br>
      <b>рівних кутів немає</b>, отже трикутник <b>різносторонній</b>.<br>
      Квадратик позначає прямий кут, це не позначка рівності.`,
    groups: ["Різносторонні","Рівнобедрені","Рівносторонні"],
    classify: t => { const e = eqSides(t.ang); return e===3 ? 2 : e===2 ? 1 : 0; },
    explain: t => { const e = eqSides(t.ang);
      return e===3 ? "Усі три кути позначені однаковими дужками. Якщо всі кути рівні, то й усі сторони рівні: трикутник рівносторонній."
           : e===2 ? "Два кути позначені однаковими дужками. Напроти рівних кутів лежать рівні сторони, тому трикутник рівнобедрений."
           : "Рівних кутів немає, тож і рівних сторін немає: трикутник різносторонній."; },
    items: [
      {ang:[40,60,80], rot:30,  size:.9},
      {ang:[30,60,90], rot:220, size:.95},
      {ang:[20,45,115],rot:-20, size:1},
      {ang:[50,55,75], rot:150, size:.8},
      {ang:[65,65,50], rot:15,  size:.85},
      {ang:[35,35,110],rot:200, size:1},
      {ang:[45,45,90], rot:60,  size:.85},
      {ang:[75,75,30], rot:290, size:.9},
      {ang:[60,60,60], rot:10,  size:.85},
      {ang:[60,60,60], rot:70,  size:.7},
      {ang:[60,60,60], rot:200, size:.95},
      {ang:[60,60,60], rot:145, size:.8}
    ]
  },
  {
    tab: "3. Гострий, прямий чи тупий",
    marks: "sides",
    title: "Розклади трикутники за кутами",
    how: "Знайди в кожному трикутнику найбільший кут. Прямий кут позначено квадратиком. Якщо підписано градуси, дивись на числа, а не на те, як кут виглядає на малюнку.",
    hint: `<b>Гострий</b> кут менший за 90°, <b>прямий</b> дорівнює 90°, <b>тупий</b> більший за 90°.<br>
      <b>Гострокутний</b> трикутник: усі три кути гострі.<br>
      <b>Прямокутний:</b> один кут прямий (позначений квадратиком).<br>
      <b>Тупокутний:</b> один кут тупий.<br>
      У трикутнику може бути лише один прямий або один тупий кут, тому досить знайти найбільший кут.`,
    groups: ["Гострокутні","Прямокутні","Тупокутні"],
    classify: t => { const m = Math.max(...t.ang); return m===90 ? 1 : m>90 ? 2 : 0; },
    explain: t => { const m = Math.max(...t.ang);
      return m===90 ? "Один кут прямий (позначений квадратиком), тому трикутник прямокутний."
           : m>90 ? `Найбільший кут тупий (${m}°, більший за 90°), тому трикутник тупокутний.`
           : `Найбільший кут ${m}°, він гострий. Усі три кути гострі, тому трикутник гострокутний.`; },
    items: [
      {ang:[60,60,60], rot:20,  size:.8},
      {ang:[50,60,70], rot:0,   size:.95},
      {ang:[70,70,40], rot:160, size:.85},
      {ang:[80,55,45], rot:-30, size:1, deg:true},
      {ang:[90,45,45], rot:0,   size:.85},
      {ang:[30,60,90], rot:120, size:1},
      {ang:[90,35,55], rot:200, size:.9},
      {ang:[45,45,90], rot:-60, size:.75},
      {ang:[30,30,120],rot:0,   size:1},
      {ang:[25,35,120],rot:40,  size:.9},
      {ang:[40,45,95], rot:10,  size:1, deg:true},
      {ang:[20,30,130],rot:200, size:.95}
    ]
  }
];

/* ======================= МАЛЮВАННЯ ТРИКУТНИКА ======================= */
const R = d => d*Math.PI/180;
function eqSides(ang){ // скільки сторін рівні між собою (сторони напроти рівних кутів)
  const [a,b,c]=ang; if(a===b&&b===c) return 3; if(a===b||b===c||a===c) return 2; return 1;
}
function triSVG(t, opts={}){
  const [A,B,C]=t.ang, VB=120;
  // A(0,0), B(1,0), C за теоремою синусів
  const bLen=Math.sin(R(B))/Math.sin(R(C));
  let P=[[0,0],[1,0],[bLen*Math.cos(R(A)), -bLen*Math.sin(R(A))]];
  const rot=R(t.rot||0);
  P=P.map(([x,y])=>[x*Math.cos(rot)-y*Math.sin(rot), x*Math.sin(rot)+y*Math.cos(rot)]);
  const xs=P.map(p=>p[0]), ys=P.map(p=>p[1]);
  const w=Math.max(...xs)-Math.min(...xs), h=Math.max(...ys)-Math.min(...ys);
  const k=(VB-28)*(t.size||1)/Math.max(w,h);
  const ox=(VB-w*k)/2-Math.min(...xs)*k, oy=(VB-h*k)/2-Math.min(...ys)*k;
  P=P.map(([x,y])=>[x*k+ox, y*k+oy]);
  const sw = opts.small ? 2.4 : 2;
  let s=`<svg viewBox="0 0 ${VB} ${VB}" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<polygon points="${P.map(p=>p.join(",")).join(" ")}" fill="#F4EBE1" stroke="#253042" stroke-width="${sw}" stroke-linejoin="round"/>`;
  const ang=[A,B,C];
  // рівні сторони: сторона i лежить напроти вершини i
  const sides=[[1,2],[2,0],[0,1]];
  const len=sides.map(([i,j])=>Math.hypot(P[i][0]-P[j][0],P[i][1]-P[j][1]));
  const e=eqSides(ang);
  if(opts.marks!=="angles") sides.forEach(([i,j],si)=>{
    const equal = e===3 || (e===2 && ang.filter(x=>x===ang[si]).length===2);
    if(!equal) return;
    const mx=(P[i][0]+P[j][0])/2, my=(P[i][1]+P[j][1])/2;
    const ux=(P[j][0]-P[i][0])/len[si], uy=(P[j][1]-P[i][1])/len[si];
    const nx=-uy, ny=ux, L=6;
    s+=`<line x1="${mx-nx*L}" y1="${my-ny*L}" x2="${mx+nx*L}" y2="${my+ny*L}" stroke="#AF5940" stroke-width="2.4" stroke-linecap="round"/>`;
  });
  // кути: прямий квадратиком, рівні дужками
  ang.forEach((a,vi)=>{
    const V=P[vi], U=P[(vi+1)%3], W=P[(vi+2)%3];
    const du=Math.hypot(U[0]-V[0],U[1]-V[1]), dw=Math.hypot(W[0]-V[0],W[1]-V[1]);
    const u=[(U[0]-V[0])/du,(U[1]-V[1])/du], w2=[(W[0]-V[0])/dw,(W[1]-V[1])/dw];
    if(a===90){
      const q=9;
      s+=`<path d="M${V[0]+u[0]*q},${V[1]+u[1]*q} L${V[0]+(u[0]+w2[0])*q},${V[1]+(u[1]+w2[1])*q} L${V[0]+w2[0]*q},${V[1]+w2[1]*q}" fill="none" stroke="#253042" stroke-width="1.6"/>`;
    } else if(opts.marks==="angles" && ang.filter(x=>x===a).length>=2){
      const r=a<40?19:a>100?11:15;
      const p1=[V[0]+u[0]*r,V[1]+u[1]*r], p2=[V[0]+w2[0]*r,V[1]+w2[1]*r];
      const cross=u[0]*w2[1]-u[1]*w2[0];
      s+=`<path d="M${p1[0]},${p1[1]} A${r},${r} 0 0 ${cross>0?1:0} ${p2[0]},${p2[1]}" fill="none" stroke="#3B7EA1" stroke-width="2.6"/>`;
    }
    if(t.deg && !opts.small){
      const bx=(u[0]+w2[0]), by=(u[1]+w2[1]), bl=Math.hypot(bx,by)||1;
      const d=a<50?27:a>100?17:23;
      s+=`<text x="${V[0]+bx/bl*d}" y="${V[1]+by/bl*d+3.5}" font-size="10.5" font-weight="700" fill="#253042" text-anchor="middle" font-family="Montserrat,Arial">${a}°</text>`;
    }
  });
  return s+"</svg>";
}

/* ============================ ЛОГІКА ============================ */
const $ = id => document.getElementById(id);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const state = TASKS.map(()=>({first:null}));
let curTask = 0;

function renderTabs(){
  $("tabs").innerHTML="";
  TASKS.forEach((T,k)=>{
    const b=document.createElement("button");
    b.className="tab"+(k===curTask?" cur":"")+(state[k].first!==null?" done":"");
    b.innerHTML=T.tab+(state[k].first!==null?` <b>${state[k].first}/${T.items.length}</b>`:"");
    b.onclick=()=>{ curTask=k; renderTabs(); document.querySelectorAll(".task").forEach((d,j)=>d.classList.toggle("cur",j===k)); };
    $("tabs").appendChild(b);
  });
}
function buildTask(k){
  const T=TASKS[k], d=document.createElement("div");
  d.className="task"+(k===0?" cur":""); d.dataset.scope=k;
  d.innerHTML=`<h2>${T.title}</h2><p class="how">${T.how}</p>
    <details class="hint"><summary>💡 Підказка</summary><div class="box">${T.hint}</div></details>
    <div class="bank" data-zone="bank"></div>
    <div class="zones">${T.groups.map((g,i)=>`<div class="zone z${i}" data-zone="${i}"><h3>${g}</h3><div class="in"></div></div>`).join("")}</div>
    <div class="bar"><button class="btn main chk">Перевірити</button><button class="btn sec hidden rty">Виправити помилки</button><button class="btn sec rst">Почати спочатку</button><span class="count"></span></div>
    <div class="fb"></div><div class="why hidden"></div>`;
  $("tasks").appendChild(d);
  const q=sel=>d.querySelector(sel);
  const fill=()=>{
    state[k].first=null;
    q(".bank").innerHTML=""; d.querySelectorAll(".zone .in").forEach(z=>z.innerHTML="");
    shuffle(T.items.map((_,i)=>i)).forEach(i=>{
      const c=document.createElement("div"); c.className="chip"; c.dataset.i=i; c.innerHTML=triSVG(T.items[i],{marks:T.marks});
      q(".bank").appendChild(c);
    });
    q(".fb").textContent=""; q(".fb").className="fb"; q(".why").classList.add("hidden");
    q(".rty").classList.add("hidden"); q(".chk").classList.remove("hidden"); count(); renderTabs();
  };
  const count=()=>{ q(".count").textContent=`Залишилося: ${q(".bank").children.length}`; };
  d.addEventListener("placed",count);
  q(".chk").onclick=()=>{
    if(q(".bank").children.length){ q(".fb").className="fb meh"; q(".fb").textContent="Спочатку розклади всі трикутники."; return; }
    let g=0; const wrong=[];
    d.querySelectorAll(".zone").forEach(z=>z.querySelectorAll(".chip").forEach(c=>{
      const it=T.items[c.dataset.i], ok=T.classify(it)===+z.dataset.zone;
      c.classList.toggle("ok",ok); c.classList.toggle("bad",!ok); if(ok) g++; else wrong.push(it);
    }));
    if(state[k].first===null) state[k].first=g;
    renderTabs();
    if(wrong.length){
      q(".why").innerHTML=`<h3>Де помилка</h3>`+wrong.map(it=>`<div class="it">${triSVG(it,{small:true,marks:T.marks})}<div>${T.explain(it)}</div></div>`).join("");
      q(".why").classList.remove("hidden");
      q(".fb").className="fb meh"; q(".fb").textContent=`Правильно ${g} з ${T.items.length}. Червоні трикутники лежать не в своїй групі.`;
      q(".chk").classList.add("hidden"); q(".rty").classList.remove("hidden");
    } else {
      q(".why").classList.add("hidden");
      const f=state[k].first, n=T.items.length;
      q(".fb").className="fb good";
      q(".fb").innerHTML=`<span class="score">${f} з ${n}</span>`+(f===n?"Бездоганно! Усе розкладено з першої спроби.":"Готово! Усі трикутники на своїх місцях. У рахунок пішла перша спроба.")+(k<TASKS.length-1?` <button class="btn main nxt" style="margin-left:8px">Далі →</button>`:"");
      const nx=q(".nxt"); if(nx) nx.onclick=()=>{ curTask=k+1; renderTabs(); document.querySelectorAll(".task").forEach((dd,j)=>dd.classList.toggle("cur",j===curTask)); window.scrollTo({top:0,behavior:"smooth"}); };
      q(".chk").classList.add("hidden"); q(".rty").classList.add("hidden");
    }
  };
  q(".rty").onclick=()=>{
    d.querySelectorAll(".chip.bad").forEach(c=>{ c.classList.remove("bad"); q(".bank").appendChild(c); });
    q(".fb").textContent=""; q(".fb").className="fb"; q(".why").classList.add("hidden");
    q(".rty").classList.add("hidden"); q(".chk").classList.remove("hidden"); count();
  };
  q(".rst").onclick=fill;
  fill();
}
TASKS.forEach((_,k)=>buildTask(k));
renderTabs();

/* ======================= ПЕРЕТЯГУВАННЯ ======================= */
let drag=null, sel=null;
const clearSel=()=>{ if(sel){ sel.classList.remove("selected"); sel=null; } };
const clearHover=()=>document.querySelectorAll(".hover").forEach(x=>x.classList.remove("hover"));
const scopeOf=n=>n.closest("[data-scope]");
const zoneAt=(x,y)=>{ const u=document.elementFromPoint(x,y); return u&&u.closest("[data-zone]"); };
function place(chip, zone){
  if(!zone || chip.classList.contains("ok") || scopeOf(zone)!==scopeOf(chip)) return;
  const target = zone.dataset.zone==="bank" ? zone : zone.querySelector(".in");
  if(chip.parentElement===target) return;
  chip.classList.remove("bad"); target.appendChild(chip);
  const sc=scopeOf(chip); sc.querySelector(".fb").textContent=""; sc.dispatchEvent(new Event("placed"));
}
document.addEventListener("pointerdown",e=>{ const c=e.target.closest(".chip"); if(!c||c.classList.contains("ok")) return; drag={c,x:e.clientX,y:e.clientY,ghost:null}; });
document.addEventListener("pointermove",e=>{
  if(!drag) return;
  if(!drag.ghost){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6) return;
    const r=drag.c.getBoundingClientRect(), g=drag.c.cloneNode(true);
    g.classList.add("ghost"); g.classList.remove("selected"); g.style.width=r.width+"px";
    document.body.appendChild(g); drag.ghost=g; drag.ox=drag.x-r.left; drag.oy=drag.y-r.top;
    drag.c.classList.add("placeholder"); clearSel();
  }
  drag.ghost.style.left=(e.clientX-drag.ox)+"px"; drag.ghost.style.top=(e.clientY-drag.oy)+"px";
  clearHover(); const z=zoneAt(e.clientX,e.clientY); if(z&&scopeOf(z)===scopeOf(drag.c)) z.classList.add("hover");
  e.preventDefault();
},{passive:false});
document.addEventListener("pointerup",e=>{
  if(!drag) return; const d=drag; drag=null;
  if(d.ghost){ d.ghost.remove(); d.c.classList.remove("placeholder"); clearHover(); place(d.c, zoneAt(e.clientX,e.clientY)); }
  else { if(sel===d.c) clearSel(); else { clearSel(); sel=d.c; sel.classList.add("selected"); } }
});
document.addEventListener("pointercancel",()=>{ if(drag&&drag.ghost){drag.ghost.remove(); drag.c.classList.remove("placeholder");} drag=null; clearHover(); });
document.addEventListener("click",e=>{ if(!sel||e.target.closest(".chip")) return; const z=e.target.closest("[data-zone]"); if(z){ place(sel,z); clearSel(); } });
</script>
</body>
